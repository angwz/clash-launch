# 构建并发布镜像到 ghcr.io/<所有者>/clash-launch（amd64 与 arm64）。
#   推送到 main → :latest 与 :sha-<短哈希>
#   推送 v1.2.3 标签 → :1.2.3、:1.2 与 :latest
# 构建在 x86 运行器上交叉编译（Dockerfile 的构建阶段都用 BUILDPLATFORM），不需要 QEMU。
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe 需要完整历史与标签

      # 版本号：标签构建为 1.2.3；main 构建为 1.2.3-14-g769fef4（v1.2.3 之后第 14 次提交）
      - id: ver
        run: |
          v=$(git describe --tags --long --match 'v*' --abbrev=7)
          case "$v" in *-0-g*) v=${v%-0-g*} ;; esac
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Clash, Launch!
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.ver.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
