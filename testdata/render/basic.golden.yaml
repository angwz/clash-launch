# NAME: golden
# TARGET: mihomo · mihomo 1.19.33

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

experimental:
  some-new-field: true

hosts:
  router.lan: 192.0.2.1
  '*.example.net':
    - 192.0.2.2
    - 192.0.2.3

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
  auto-route: true

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - '*.lan'
    - +.local
  nameserver:
    - https://doh.example.com/dns-query
    - tls://192.0.2.53:853
  nameserver-policy:
    geosite:cn,private:
      - https://doh.example.com/dns-query
    +.example.org: 192.0.2.53

proxies:
  - name: 🇸🇬 广港 IEPL 新加坡 01
    type: vmess
    server: 192.0.2.10
    port: 443
    uuid: 11111111-2222-3333-4444-555555555555
    alterId: 0
    cipher: auto
    tls: true
    servername: cdn.example.com
    network: ws
    ws-opts:
      path: /ray
      headers:
        Host: cdn.example.com

  - name: 🪐 未知地区
    type: ss
    server: 2001:db8::1
    port: 8388
    cipher: 2022-blake3-aes-128-gcm
    password: MDEyMzQ1Njc4OWFiY2RlZg==
    udp: true

  - name: 'yes'
    type: trojan
    server: example.com
    port: 443
    password: pw
    udp: true
    sni: example.com
    x-unknown: 1

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇸🇬 广港 IEPL 新加坡 01
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    proxies:
      - 🇸🇬 广港 IEPL 新加坡 01
      - 🪐 未知地区
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

rule-providers:
  Proxy:
    behavior: domain
    interval: 86400
    path: ./ruleset/Proxy.yaml
    type: http
    url: https://rules.example.com/Proxy.yaml

rules:
  - DOMAIN-SUFFIX,example.com,DIRECT
  - RULE-SET,Proxy,🚀 节点选择
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,🐟 漏网之鱼
