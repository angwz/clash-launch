; 合成的 subconverter 外部配置（ACL4SSR 风格），覆盖解析器支持的全部语法。地址均为示例地址。
[custom]
ruleset=🎯 全球直连,https://rules.example.com/Clash/LocalAreaNetwork.list
ruleset=🛑 全球拦截,clash-domain:https://rules.example.com/clash-domain/Reject.yaml,43200
ruleset=🚀 节点选择,clash-ipcidr:https://rules.example.com/clash-ipcidr/Telegram.yaml
