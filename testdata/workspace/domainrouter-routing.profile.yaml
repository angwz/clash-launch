clash-launch/profile: v1
name: M2 · domainrouter_v2（自己管理）
target: { pack: mihomo, preset: mihomo, core: "1.19.33" }
output: { timezone: Asia/Shanghai }
sources:
  - ref: src_airport_a
  - ref: src_my_vps
  - ref: src_airport_b
rules: { ref: rs_domainrouter }
form:
  mixed-port: 7890
  mode: rule
  log-level: info
  dns: { enable: true, enhanced-mode: fake-ip, nameserver: [https://doh.example.com/dns-query] }
raw: |
  rules: !prepend
    - DOMAIN,intranet.example.com,DIRECT
routing:
  from:
    rules: rs_domainrouter
    digest: sha256:54ea8c7d106397340c261af4f64a1aabbf805058c6c6ef2e331588be4b3de8a3
    at: '2026-11-15T00:00:00Z'

  groups:
    - name: 🌠 节点选择
      type: select
      rule:
        - '[]🛫 香港专线'
        - '[]⛳ 美国专线'
        - '[]🌺 日本专线'
        - '[]🧊 新加坡专线'
        - '[]✈️ 手动切换'
        - '[]DIRECT'
    - name: ✈️ 手动切换
      type: select
      rule:
        - '[]⛳ 美国专线'
        - (.*)
    - name: 🗨️ ChatGPT
      type: select
      rule:
        - '[]⛳ 美国专线'
        - '[]🌺 日本专线'
        - '[]🧊 新加坡专线'
