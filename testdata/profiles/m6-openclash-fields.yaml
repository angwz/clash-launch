clash-launch/profile: v1
name: M6 · OpenClash 与补全字段
target: { pack: mihomo, preset: openclash, core: "1.19.33" }
output: { timezone: Asia/Shanghai }
form:
  mixed-port: 7893
  allow-lan: true
  mode: rule
  log-level: info
  external-controller: 0.0.0.0:9090
  dns:
    enable: true
    listen: 0.0.0.0:7874
    enhanced-mode: fake-ip
    nameserver: [https://doh.example.com/dns-query]
  listeners:
    - name: mixed-in
      type: mixed
      port: 17890
      listen: 127.0.0.1
      udp: true
      users: [{username: example, password: example-password}]
    - name: ss-in
      type: shadowsocks
      port: "17891,17892"
      listen: 127.0.0.1
      password: example-password
      cipher: aes-128-gcm
      shadow-tls:
        enable: true
        version: 3
        users: [{name: example, password: example-password}]
        handshake: {dest: www.example.com:443}
    - name: vless-in
      type: vless
      port: 17893
      listen: 127.0.0.1
      users: [{username: example, uuid: 00000000-0000-4000-8000-000000000004, flow: ""}]
      xhttp-config: {path: /xhttp, mode: auto, no-sse-header: false, sc-max-buffered-posts: "30"}
      reality-config:
        dest: www.example.com:443
        private-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        short-id: ["0123456789abcdef"]
        server-names: [www.example.com]
        limit-fallback-upload: {after-bytes: 0, bytes-per-sec: 0, burst-bytes-per-sec: 0}
    - name: tunnel-in
      type: tunnel
      port: 17894
      listen: 127.0.0.1
      network: [tcp, udp]
      target: 192.0.2.30:53
raw: |
  # 节点、策略组与规则由生成器产出；这里用原始编辑写入，检查新收录字段的键序与内核兼容性
  proxies:
    - name: vless-xhttp
      type: vless
      server: vless.example.com
      port: 443
      uuid: 00000000-0000-4000-8000-000000000001
      network: xhttp
      tls: true
      servername: vless.example.com
      xhttp-opts:
        path: /xhttp
        host: vless.example.com
        mode: auto
        x-padding-bytes: 100-1000
        session-placement: query
        session-key: sid
        reuse-settings:
          max-concurrency: 16-32
          h-keep-alive-period: 0
        download-settings:
          path: /down
          server: down.example.com
          port: 443
          tls: true
          servername: down.example.com
    - name: trojan-shadowtls
      type: trojan
      server: trojan.example.com
      port: 443
      password: example-password
      sni: trojan.example.com
      shadow-tls-opts: {version: 3, password: example-shadowtls}
    - name: vmess-restls
      type: vmess
      server: vmess.example.com
      port: 443
      uuid: 00000000-0000-4000-8000-000000000002
      alterId: 0
      cipher: auto
      tls: true
      servername: vmess.example.com
      restls-opts: {password: example-restls, version-hint: tls13}
    - name: vmess-mkcp
      type: vmess
      server: 192.0.2.10
      port: 443
      uuid: 00000000-0000-4000-8000-000000000003
      alterId: 0
      cipher: auto
      network: mkcp
      mkcp-opts: {mtu: 1350, tti: 50, uplink-capacity: 5, downlink-capacity: 20, congestion: false, header: wechat-video}
    - name: hy2-realm
      type: hysteria2
      server: hy2.example.com
      port: 443
      password: example-password
      realm-opts:
        enable: true
        server-url: https://realm.example.com
        token: example-token
        realm-id: example-cabin
        stun-servers: [stun.example.com:3478]
    - name: awg
      type: wireguard
      server: 192.0.2.20
      port: 51820
      ip: 172.16.0.2
      private-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      public-key: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
      udp: true
      ip-stack: {mode: auto, congestion-controller: cubic}
      amnezia-wg-option: {version: 2, jc: 5, jmin: 500, jmax: 501, s1: 30, s2: 40, h1: "123456", h2: "67543", h3: "123123", h4: "32345"}
    - {name: reject-drop, type: reject}
    - {name: rematch, type: rematch, target-rematch-name: rematch1}
    - {name: gost-hop, type: gost-relay, server: relay.example.com, port: 443, udp: true, tls: true, sni: relay.example.com}
    - {name: shadowquic, type: shadowquic, server: sq.example.com, port: 443, username: example, password: example-password, sni: sq.example.com, congestion-controller: bbr}
    - name: sudoku
      type: sudoku
      server: sudoku.example.com
      port: 443
      key: 00000000-0000-4000-8000-000000000005
      aead-method: chacha20-poly1305
      padding-min: 2
      padding-max: 7
      table-type: prefer_ascii
      httpmask: {disable: false, mode: legacy}
    - {name: trusttunnel, type: trusttunnel, server: 192.0.2.40, port: 443, username: example, password: example-password, udp: true, health-check: true}
  proxy-groups:
    - {name: PROXY, type: select, proxies: [vless-xhttp, trojan-shadowtls, vmess-restls, vmess-mkcp, hy2-realm, awg, gost-hop, shadowquic, sudoku, trusttunnel, rematch, reject-drop, DIRECT]}
  rules:
    - MATCH,PROXY
