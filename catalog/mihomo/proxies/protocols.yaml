    - {key: custom-tables, type: list, items: {type: string}, importance: expert, doc: proxies, zh: [自定义布局列表, "多表轮换；非空时覆盖 custom-table。"], en: [Custom tables, "Rotated layouts; overrides custom-table when non-empty."]}
