# OpenClash（OpenWrt LuCI 插件）。依据与取舍见 docs/decisions/0006-openclash-preset.md。
#
# OpenClash 启动内核前会按 LuCI 设置改写部分字段（详见决定 0006）。生成器不替用户做取舍：
# 用户设置什么就输出什么，也不逐字段提示（反馈 #17）。
# 参考提交：vernesong/OpenClash@e553e82（master，luci-app-openclash 0.48.002）。
id: openclash
label: {en: OpenClash (OpenWrt), zh: OpenClash（OpenWrt）}
platform: openwrt
core: mihomo
docs: https://github.com/vernesong/OpenClash/wiki
kernel: true
basis:
  - https://github.com/vernesong/OpenClash/blob/e553e82e01c697aefbe1555261a503f425e00ccd/luci-app-openclash/root/usr/share/openclash/yml_change.sh
  - https://github.com/vernesong/OpenClash/blob/e553e82e01c697aefbe1555261a503f425e00ccd/luci-app-openclash/root/usr/share/openclash/yml_rules_change.sh
  - https://github.com/vernesong/OpenClash/blob/e553e82e01c697aefbe1555261a503f425e00ccd/luci-app-openclash/root/etc/init.d/openclash
  - https://github.com/vernesong/OpenClash/blob/e553e82e01c697aefbe1555261a503f425e00ccd/luci-app-openclash/root/etc/config/openclash
  - https://github.com/vernesong/OpenClash/blob/e553e82e01c697aefbe1555261a503f425e00ccd/luci-app-openclash/root/usr/share/openclash/openclash_core.sh
notes:
  en: Subscription for OpenClash on OpenWrt, checked against its bundled mihomo core.
  zh: 生成给 OpenWrt 上 OpenClash 使用的订阅，按它自带的 mihomo 内核检查。
