# rules 与 sub-rules。规则是字符串，语法由内核检查把关；目录只描述分节本身。
fields:
  - key: rules
    type: list
    items: {type: string}
    importance: core
    doc: rules
    examples: [{value: ["DOMAIN-SUFFIX,example.com,DIRECT", "MATCH,PROXY"], en: Minimal rules, zh: 最简规则}]
    zh: [规则, "自上而下匹配的分流规则；第一条命中的规则决定出口。"]
    en: [Rules, "Routing rules matched top to bottom; the first match decides the outbound."]
    detail:
      zh: 规则的格式为「类型,条件,策略[,参数]」，最后一条通常是 MATCH。由规则源生成的规则与原始编辑中 !prepend/!append 写入的规则按顺序合并。
      en: Each rule is TYPE,VALUE,POLICY[,OPTIONS]; the last one is usually MATCH. Generated rules are merged in order with rules added by !prepend/!append in raw edit.
  - key: sub-rules
    type: map
    values: {type: list, items: {type: string}}
    importance: expert
    doc: sub-rule
    zh: [子规则, "命名的规则集合，由 SUB-RULE 规则分叉进入。"]
    en: [Sub-rules, "Named rule sets entered through SUB-RULE."]
