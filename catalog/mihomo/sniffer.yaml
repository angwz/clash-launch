# sniffer 分节（wiki 页名为 sniff）。顺序取自官方示例。
fields:
  - key: sniffer
    type: object
    importance: recommended
    doc: sniff
    zh: [域名嗅探, "从 TLS、HTTP、QUIC 流量中识别域名，供规则匹配使用。"]
    en: [Sniffer, "Recover domain names from TLS, HTTP and QUIC traffic for rule matching."]
    fields:
      - {key: enable, type: bool, default: false, importance: recommended, doc: "sniff#enable", zh: [启用, "启用域名嗅探。"], en: [Enable, "Enable sniffing."]}
      - {key: force-dns-mapping, type: bool, default: true, importance: optional, doc: "sniff#force-dns-mapping",
         zh: [强制嗅探映射, "对 redir-host 类型识别的流量强制嗅探。"], en: [Force DNS mapping, "Always sniff traffic identified through redir-host mapping."]}
      - {key: parse-pure-ip, type: bool, default: true, importance: optional, doc: "sniff#parse-pure-ip",
         zh: [嗅探纯 IP, "对没有域名的流量强制嗅探。"], en: [Parse pure IP, "Sniff traffic that has no domain name."]}
      - {key: override-destination, type: bool, default: true, importance: optional, doc: "sniff#override-destination",
         zh: [覆盖目标, "用嗅探到的域名作为实际连接目标。"], en: [Override destination, "Connect to the sniffed domain instead of the original target."]}
      - key: sniff
        type: map
        values:
          type: object
          fields:
            - {key: ports, type: list, items: {type: string}, importance: optional, zh: [端口, "需要嗅探的端口或端口范围。"], en: [Ports, "Ports or port ranges to sniff."]}
            - {key: override-destination, type: bool, importance: optional, zh: [覆盖目标, "覆盖全局的 override-destination。"], en: [Override destination, "Overrides the global override-destination."]}
        importance: recommended
        doc: "sniff#sniff"
        examples: [{value: {TLS: {ports: [443, 8443]}, HTTP: {ports: [80, 8080-8880]}}, en: Sniff TLS and HTTP, zh: 嗅探 TLS 与 HTTP}]
        zh: [嗅探协议, "按协议（TLS、HTTP、QUIC）设置嗅探端口；TLS 与 QUIC 默认 443，HTTP 默认 80。"]
        en: [Protocols, "Per-protocol (TLS, HTTP, QUIC) sniffing ports; TLS and QUIC default to 443, HTTP to 80."]
      - {key: force-domain, type: list, items: {type: string}, importance: optional, doc: "sniff#force-domain",
         zh: [强制嗅探域名, "这些域名总是进行嗅探。"], en: [Force domains, "Always sniff these domains."]}
      - {key: skip-src-address, type: list, items: {type: string}, importance: expert, doc: "sniff#skip-src-address",
         zh: [跳过来源, "来自这些地址的流量不嗅探。"], en: [Skip sources, "Do not sniff traffic from these addresses."]}
      - {key: skip-dst-address, type: list, items: {type: string}, importance: expert, doc: "sniff#skip-dst-address",
         zh: [跳过目标, "发往这些地址的流量不嗅探。"], en: [Skip destinations, "Do not sniff traffic to these addresses."]}
      - {key: skip-domain, type: list, items: {type: string}, importance: optional, doc: "sniff#skip-domain",
         zh: [跳过域名, "嗅探结果为这些域名时不采用。"], en: [Skip domains, "Ignore sniffing results for these domains."]}
      - {key: sniffing, type: list, items: {type: string}, importance: expert, stability: deprecated, replacement: sniffer.sniff, doc: sniff,
         zh: [嗅探协议（旧）, "已弃用；配置 sniff 后无效。"], en: [Protocols (legacy), "Deprecated; ignored when sniff is set."]}
      - {key: port-whitelist, type: list, items: {type: string}, importance: expert, stability: deprecated, replacement: sniffer.sniff, doc: sniff,
         zh: [端口白名单（旧）, "已弃用；配置 sniff 后无效。"], en: [Port allowlist (legacy), "Deprecated; ignored when sniff is set."]}
