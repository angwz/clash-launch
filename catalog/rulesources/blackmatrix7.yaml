# blackmatrix7/ios_rule_script：按应用划分的大量规则（rule/Clash/<应用>/<应用>.yaml，classical）。
id: blackmatrix7
label: {en: blackmatrix7 ios_rule_script, zh: blackmatrix7 ios_rule_script}
repo: https://github.com/blackmatrix7/ios_rule_script
license: GPL-2.0
checked: "2026-11-09"
stars: 28583
notes:
  en: Per-application classical rule sets; the template picks a few common services — add more from rule/Clash/.
  zh: 按应用划分的 classical 规则集；模板挑选了几个常用服务，更多见仓库的 rule/Clash/。
variants:
  - id: apps
    label: {en: Common apps, zh: 常用应用}
    groups-text: |
      [[custom_groups]]
      name = "🚀 节点选择"
      type = "select"
      rule = ["[]DIRECT", ".*"]

      [[custom_groups]]
      name = "🤖 OpenAI"
      type = "select"
      rule = ["[]🚀 节点选择", ".*"]

      [[custom_groups]]
      name = "📺 YouTube"
      type = "select"
      rule = ["[]🚀 节点选择", ".*"]
    rulesets-text: |
      [[rulesets]]
      group = "🤖 OpenAI"
      ruleset = "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.yaml"
      type = "clash-classic"
      [[rulesets]]
      group = "📺 YouTube"
      ruleset = "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml"
      type = "clash-classic"
      [[rulesets]]
      group = "DIRECT"
      ruleset = "[]GEOIP,CN"
      [[rulesets]]
      group = "🚀 节点选择"
      ruleset = "[]MATCH"
