# 规则集说明（docs/design/routing.md 第 13 节第 1 步）：按规则地址的正则给出常见上游规则集的用途。
#
# 只写上游自己在文档里说明过的内容，并注明依据（ref）与核对日期；查不到的规则集不写，
# 界面上只显示名称、条数和从内容里抽取的样例。正则为 Go RE2 语法，整串匹配请自带 ^ 与 $。
# 一个地址最多被一条说明匹配（TestRulesetDescriptions 检查），每条说明至少匹配一个预设中的地址。

sources:
  - id: domainrouter
    repo: https://github.com/angwz/domainrouter_v2
    license: 见仓库
    checked: "2026-11-15"
    ref: README.md「特点」「产物一瞥」（domainrouter_v2@2c812f9）
    sets:
      - match: '^https://raw\.githubusercontent\.com/angwz/domainrouter_v2/release/clash-(domain|ipcidr|classic)/[^/]+\.(yaml|mrs)$'
        zh: domainrouter_v2 每日从多个上游编译、去重与合并的规则集。同名的 X、X-ipcidr、X-classic 是同一类规则的 domain、ipcidr、classical 三种文件；YAML 与 MRS 内容一致。文件头写明对应的策略组与上游来源。
        en: Rule sets compiled daily by domainrouter_v2 from many upstreams, deduplicated and merged. Files named X, X-ipcidr and X-classic hold the domain, ipcidr and classical parts of one category; the YAML and MRS files match the same traffic. The file header names the target group and the upstream sources.

  - id: acl4ssr
    repo: https://github.com/ACL4SSR/ACL4SSR
    license: CC-BY-SA-4.0
    checked: "2026-11-15"
    ref: README.md「Clash规则碎片」表（ACL4SSR/ACL4SSR@bdc102f）
    sets:
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/BanAD\.list$'
        zh: 去广告：常见的广告关键字与广告联盟。上游说明为无副作用。
        en: "Ad blocking: common ad keywords and ad networks. Upstream describes it as side-effect free."
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD\.list$'
        zh: 去广告：常用应用内的广告。上游说明可能有轻微副作用，与网站功能冲突的规则会被删除。
        en: "Ad blocking: ads inside common apps. Upstream notes possible minor side effects; rules that break site features are removed."
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina\.list$'
        zh: 去广告：AdblockPlus 中国规则里的全部屏蔽域名。
        en: "Ad blocking: every blocked domain from the AdblockPlus China list."
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork\.list$'
        zh: 直连：本地地址与路由器管理域名等。
        en: "Direct: local addresses, router admin domains and similar."
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain\.list$'
        zh: 直连：国内常见域名与可直连的 CDN，覆盖面很广。
        en: "Direct: common domains in mainland China and directly reachable CDNs; broad coverage."
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp\.list$'
        zh: 直连：国内大型互联网公司与云服务商的 IP 段。部署在这些云上的网站都会直连，包括其境外机房（如阿里云香港）。
        en: "Direct: IP ranges of major Chinese internet companies and cloud providers. Sites hosted on these clouds go direct, including their overseas regions (for example Alibaba Cloud Hong Kong)."
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/Download\.list$'
        zh: 直连：一些下载用的域名。
        en: "Direct: domains used for downloads."
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/Apple\.list$'
        zh: 苹果公司的域名。
        en: Apple's domains.
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft\.list$'
        zh: 微软公司的域名。
        en: Microsoft's domains.
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/OneDrive\.list$'
        zh: OneDrive。
        en: OneDrive.
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN\.list$'
        zh: 直连：谷歌在中国大陆可以直接访问的地址。
        en: "Direct: Google addresses reachable directly from mainland China."
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/Telegram\.list$'
        zh: 代理：Telegram 的域名。
        en: "Proxy: Telegram's domains."
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist\.list$'
        zh: 代理：GFWList 的全量列表。
        en: "Proxy: the full GFWList."
      - match: '^https://raw\.githubusercontent\.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite\.list$'
        zh: 代理：精简的代理列表，包含常用网站与 DNS 被污染的域名。
        en: "Proxy: a compact proxy list with commonly used sites and DNS-polluted domains."
