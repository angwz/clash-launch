# 信息节点（第 5.5 节）：机场放在节点列表里的「剩余流量」「到期时间」「官网地址」这类假节点。
# 「去掉信息节点」默认开启；被去掉的节点逐个列入诊断。每一项是匹配节点名的正则（regexp2，不区分大小写）。
patterns:
  - 剩余流量|已用流量|总流量|流量[:：]|流量重置|重置[:：]|距离下次重置
  - 到期|过期|有效期|expire|expiration
  - 官网|官方网站|网址|网站|域名[:：]|地址[:：]|发布页|永久地址|最新地址
  - 套餐|订阅|更新订阅|请更新|客户端|使用说明|教程
  - 群[:：]|群组|频道|电报|telegram 群|QQ群|tg群
  - traffic|remaining|bandwidth[:：]|官方客服|售后|工单
