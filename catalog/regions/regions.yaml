# 线路词：描述中转线路的词。它们含有地区字，但通常不是落地地，识别前先剔除。
# 「城市简称 + 地区简称」的组合由 route-cities × 各地区的 short 生成（广港、沪日、京德……）；
# 剔除后若再没有其他地区线索，才用线路词中的地区作为推断结果。
