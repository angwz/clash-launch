# 每个地区：
#   code   ISO 3166-1 两位代码          iso3  三位代码
#   zh     中文名称与常见别称（多字）    short 机场常用的单字简称（可省略）
#   en     英文名称（按词边界、不区分大小写匹配）
#   cities 主要城市（中英文混写；英文按词边界匹配）
#   codes  额外的代码写法（如 UK → GB），按词边界匹配
# 匹配时较长的词优先并占用其位置，因此「尼日利亚」不会被当作「日」，「印度尼西亚」不会被当作「印度」。
