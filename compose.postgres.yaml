# 改用 PostgreSQL（叠加在 compose.yaml 之上）：
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d
#
# 数据库文件在旁边的 postgres 文件夹；主密钥 master.key 仍在 data 文件夹，两者都要备份。
# 备份用 pg_dump，见 docs/guide/data.md。数据库只在 compose 内部网络中可达，不对外开放端口。
services:
  clash-launch:
    environment:
      CLASH_LAUNCH_DATABASE_URL: postgres://clash:${POSTGRES_PASSWORD:?在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/clash?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: clash
      POSTGRES_DB: clash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 中设置 POSTGRES_PASSWORD}
    volumes: ["./postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clash -d clash"]
      interval: 5s
      timeout: 5s
      retries: 10
