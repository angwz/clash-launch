openapi: 3.1.0
info:
  title: Clash, Launch! API
  version: 1.0.0
  description: |
    管理接口（/api/v1/）、订阅端点与健康检查。错误统一为 RFC 9457 application/problem+json，
    type 取诊断或错误代码。可修改的资源返回 ETag；修改时必须带 If-Match，版本不一致返回 412。
    认证使用会话 Cookie；除登录与设置外的写操作要求同源 Origin 与 X-CSRF-Token。
  license: {name: GPL-3.0-or-later, identifier: GPL-3.0-or-later}
servers: [{url: /}]
tags:
  - {name: subscription, description: 客户端使用的订阅端点}
  - {name: session}
  - {name: catalog}
  - {name: sources}
  - {name: rule-sources}
  - {name: profiles}
  - {name: links}
  - {name: admin}
  - {name: account}
  - {name: health}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: cl_session, description: HTTPS 下 Cookie 名为 __Host-cl_session}
    csrf: {type: apiKey, in: header, name: X-CSRF-Token}
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string}}
    lid: {name: lid, in: path, required: true, schema: {type: string}}
    pack: {name: pack, in: path, required: true, schema: {type: string, enum: [mihomo]}}
    token: {name: token, in: path, required: true, schema: {type: string}, description: 256 位随机令牌（base64url，43 个字符）}
    ifMatch: {name: If-Match, in: header, required: true, schema: {type: string}, description: 资源的 ETag，如 "v3"}
    cursor: {name: cursor, in: query, schema: {type: string}}
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
    lang: {name: lang, in: query, schema: {type: string, enum: [en, zh-CN]}}
  responses:
    Problem:
      description: 错误（RFC 9457）
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NoContent: {description: 成功，无内容}
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
    Diagnostic:
      type: object
      required: [code, severity]
      properties:
        code: {type: string}
        severity: {type: string, enum: [error, warning, info]}
        path: {type: string}
        args: {type: object, additionalProperties: {type: string}}
    User:
      type: object
      required: [id, username, role]
      properties:
        id: {type: string}
        username: {type: string}
        role: {type: string, enum: [admin, user]}
        lang: {type: string}
        timezone: {type: string}
    Session:
      type: object
      required: [user, csrf]
      properties:
        user: {$ref: '#/components/schemas/User'}
        csrf: {type: string}
    Snapshot:
      type: object
      properties:
        fetchedAt: {type: string, format: date-time}
        lastAttempt: {type: string, format: date-time}
        lastError: {type: string}
        failingSince: {type: string, format: date-time}
        hash: {type: string}
    Source:
      type: object
      required: [id, name, kind, interval, processing, version, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [single, batch, subscription, file]}
        url: {type: string}
        content: {type: string}
        ua: {type: string}
        headers: {type: object, additionalProperties: {type: string}}
        interval: {type: integer}
        processing: {type: object}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        snapshot: {$ref: '#/components/schemas/Snapshot'}
    SourceInput:
      type: object
      required: [name, kind]
      properties:
        name: {type: string}
        kind: {type: string, enum: [single, batch, subscription, file]}
        url: {type: string}
        content: {type: string}
        ua: {type: string}
        headers: {type: object, additionalProperties: {type: string}}
        interval: {type: integer}
        processing: {type: object}
    Node:
      type: object
      required: [name, type, server, port, fingerprint, region, rate, origin]
      properties:
        name: {type: string}
        type: {type: string}
        server: {type: string, description: 已打码}
        port: {type: integer}
        fingerprint: {type: string}
        region:
          type: object
          properties:
            code: {type: string}
            kind: {type: string, enum: [flag, keyword, route, manual, rule, unknown]}
            match: {type: string}
            ignored: {type: array, items: {type: string}}
            inferred: {type: boolean}
        emoji: {type: string}
        tags: {type: array, items: {type: string}}
        rate: {type: number}
        origin: {type: string}
    RuleSource:
      type: object
      required: [id, name, kind, interval, version, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [toml, ini]}
        preset: {type: string}
        groupsUrl: {type: string}
        rulesetsUrl: {type: string}
        iniUrl: {type: string}
        groupsText: {type: string}
        rulesetsText: {type: string}
        iniText: {type: string}
        interval: {type: integer}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RuleSourceInput:
      type: object
      required: [name, kind]
      properties:
        name: {type: string}
        kind: {type: string, enum: [toml, ini]}
        preset: {type: string}
        groupsUrl: {type: string}
        rulesetsUrl: {type: string}
        iniUrl: {type: string}
        groupsText: {type: string}
        rulesetsText: {type: string}
        iniText: {type: string}
        interval: {type: integer}
    RenderState:
      type: object
      required: [status, diagnostics]
      properties:
        status: {type: string, enum: [ok, failed, pending]}
        error: {type: string}
        goodAt: {type: string, format: date-time}
        lastAt: {type: string, format: date-time}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
    Profile:
      type: object
      required: [id, name, doc, version, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        doc: {type: string, description: 方案文档（clash-launch/profile v1）}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        render: {$ref: '#/components/schemas/RenderState'}
    ProfileInput:
      type: object
      required: [doc]
      properties:
        doc: {type: string}
        note: {type: string}
    Revision:
      type: object
      required: [n, doc, createdAt]
      properties:
        n: {type: integer}
        note: {type: string}
        doc: {type: string}
        createdAt: {type: string, format: date-time}
    Preview:
      type: object
      required: [yaml, diagnostics, touched, kernel, diff, numbering, nodes]
      properties:
        yaml: {type: string}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        touched: {type: array, items: {type: string}, description: 来自原始编辑的路径（⚡）}
        kernel:
          type: object
          properties:
            status: {type: string, enum: [passed, failed, unavailable, timeout]}
            version: {type: string}
            message: {type: string}
            path: {type: string}
        fatal: {type: string}
        nodes: {type: integer, description: 写入配置的节点数}
        numbering:
          type: array
          description: 订阅的编号（GROUPID），按方案中的顺序
          items: {type: object, required: [ref, name, groupId], properties: {ref: {type: string}, name: {type: string}, groupId: {type: integer}}}
        diff:
          type: array
          items:
            type: object
            required: [op, text]
            properties:
              op: {type: string, enum: [' ', '-', '+']}
              text: {type: string}
    Link:
      type: object
      required: [id, url, note, createdAt, version]
      properties:
        id: {type: string}
        url: {type: string}
        note: {type: string}
        createdAt: {type: string, format: date-time}
        lastAccess: {type: string, format: date-time}
        lastUa: {type: string}
        version: {type: integer}
    Invite:
      type: object
      required: [id, note, createdAt, status]
      properties:
        id: {type: string}
        url: {type: string, description: 只在创建时返回；令牌只以哈希存储}
        note: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        usedAt: {type: string, format: date-time}
        status: {type: string, enum: [active, used, expired]}
    Registration:
      type: object
      required: [open]
      properties:
        open: {type: boolean, description: 是否允许无邀请注册（默认关闭）}
    PoWChallenge:
      type: object
      required: [challenge, bits]
      properties:
        challenge: {type: string, description: 签名的挑战，5 分钟有效，只能使用一次}
        bits: {type: integer, description: 要求 SHA-256(challenge ":" nonce) 的前导零位数}
    PoWProof:
      type: object
      required: [challenge, nonce]
      properties:
        challenge: {type: string}
        nonce: {type: string, description: 十进制整数}
    Question:
      type: object
      required: [builtin]
      properties:
        builtin: {type: integer, description: 内置问题编号 0–9；-1 表示自定义}
        text: {type: string, description: 自定义问题的文字}
    Questions:
      type: object
      required: [questions]
      properties:
        questions: {type: array, items: {$ref: '#/components/schemas/Question'}}
    SessionInfo:
      type: object
      required: [id, device, ua, ip, createdAt, lastSeen, current]
      properties:
        id: {type: string}
        device: {type: string, description: 浏览器与系统的粗略归类}
        ua: {type: string}
        ip: {type: string, description: IP 前缀（IPv4 /24、IPv6 /48）}
        createdAt: {type: string, format: date-time}
        lastSeen: {type: string, format: date-time}
        current: {type: boolean}
    TOTPStatus:
      type: object
      required: [enabled, remainingCodes]
      properties:
        enabled: {type: boolean}
        remainingCodes: {type: integer}
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes: {type: array, items: {type: string}}
    MFAChallenge:
      type: object
      required: [mfa, ticket]
      description: 口令正确但需要第二因素时的登录响应（不设置会话）
      properties:
        mfa: {type: array, items: {type: string, enum: [totp, passkey]}}
        ticket: {type: string}
    PasskeyInfo:
      type: object
      required: [id, name, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time}
        lastUsed: {type: string, format: date-time}
    WebAuthnBegin:
      type: object
      required: [options, ticket]
      properties:
        options: {type: object, description: WebAuthn 选项，二进制字段为 base64url}
        ticket: {type: string, description: 签名的挑战凭证，5 分钟有效，只能使用一次}
    List:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {}}
        next: {type: string}
paths:
  /healthz:
    get: {tags: [health], summary: 存活检查, responses: {'200': {description: ok}}}
  /readyz:
    get: {tags: [health], summary: 就绪检查（数据库可用）, responses: {'200': {description: ready}, '503': {$ref: '#/components/responses/Problem'}}}
  /s/{token}:
    get:
      tags: [subscription]
      summary: 方案最近一次成功的渲染结果
      description: 只读缓存，不触发拉取或渲染。支持 If-None-Match；按 IP 与令牌限流（默认每分钟 30 次）。
      parameters: [{$ref: '#/components/parameters/token'}]
      responses:
        '200':
          description: text/yaml；附 Content-Disposition、profile-update-interval、可选的 subscription-userinfo 与 profile-web-page-url
          content: {text/yaml: {schema: {type: string}}}
        '304': {description: 未修改}
        '404': {description: 令牌无效}
        '429': {description: 超出频率限制，带 Retry-After}
        '503': {description: 尚无成功的渲染结果（正文是一段 YAML 注释）}
  /p/{token}/{source}:
    get:
      tags: [subscription]
      summary: 「交给客户端」模式下由本服务托管的节点文件
      parameters: [{$ref: '#/components/parameters/token'}, {name: source, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: text/yaml（proxies 列表）}, '404': {description: 不存在}, '429': {description: 超出频率限制}}
  /api/v1/setup:
    post:
      tags: [session]
      summary: 用一次性设置令牌创建首个管理员
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [token, username, password], properties: {token: {type: string}, username: {type: string}, password: {type: string}}}}}}
      responses: {'201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/session:
    post:
      tags: [session]
      summary: 登录
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username, password], properties: {username: {type: string}, password: {type: string}}}}}}
      responses: {'200': {description: 已登录并设置会话 Cookie；启用了第二因素时返回 MFAChallenge 而不设置会话, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Session'}, {$ref: '#/components/schemas/MFAChallenge'}]}}}}, '401': {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [session]
      summary: 登出
      security: [{session: [], csrf: []}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/me:
    get:
      tags: [session]
      summary: 当前用户与 CSRF 令牌
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '401': {$ref: '#/components/responses/Problem'}}
  /api/v1/register:
    get:
      tags: [session]
      summary: 注册是否开放（注册页据此决定是否要求邀请）
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Registration'}}}}}
    post:
      tags: [session]
      summary: 注册普通用户；注册关闭时需要有效的一次性邀请。按 IP 限速
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username, password, questions, answers, pow], properties: {username: {type: string}, password: {type: string}, invite: {type: string}, questions: {type: array, items: {$ref: '#/components/schemas/Question'}, minItems: 3, maxItems: 3}, answers: {type: array, items: {type: string}, minItems: 3, maxItems: 3}, pow: {$ref: '#/components/schemas/PoWProof'}}}}}}
      responses: {'201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {description: 用户名已存在}, '422': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/pow:
    get:
      tags: [session]
      summary: 工作量证明挑战（注册与找回前在浏览器中求解，约 1 秒）
      parameters: [{name: purpose, in: query, required: true, schema: {type: string, enum: [register, recover]}}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/PoWChallenge'}}}}, '400': {$ref: '#/components/responses/Problem'}}
  /api/v1/recovery/questions:
    post:
      tags: [session]
      summary: 找回时显示的安全问题；用户不存在时返回稳定的诱饵问题。按 IP 限速
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username], properties: {username: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Questions'}}}}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/recovery:
    post:
      tags: [session]
      summary: 答对至少 2 个安全问题后重设口令；该账号的全部会话失效。连续失败后锁定 15 分钟
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username, answers, password, pow], properties: {username: {type: string}, answers: {type: array, items: {type: string}, minItems: 3, maxItems: 3}, password: {type: string}, pow: {$ref: '#/components/schemas/PoWProof'}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/questions:
    get:
      tags: [account]
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Questions'}}}}}
    put:
      tags: [account]
      summary: 替换安全问题（需要当前口令）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password, questions, answers], properties: {password: {type: string}, questions: {type: array, items: {$ref: '#/components/schemas/Question'}}, answers: {type: array, items: {type: string}}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/password:
    put:
      tags: [account]
      summary: 修改口令；可同时注销其他设备
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [current, password], properties: {current: {type: string}, password: {type: string}, logoutOthers: {type: boolean}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/sessions:
    get:
      tags: [account]
      summary: 当前登录的设备
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SessionInfo'}}}}}}}}
  /api/v1/account/sessions/{id}:
    delete:
      tags: [account]
      summary: 注销一个设备
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/session/totp:
    post:
      tags: [session]
      summary: 登录第二步：用 TOTP 验证码或恢复码完成登录（凭证来自口令登录的响应，5 分钟有效）
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [ticket, code], properties: {ticket: {type: string}, code: {type: string}}}}}}
      responses: {'200': {description: 已登录, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '401': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/totp:
    get:
      tags: [account]
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/TOTPStatus'}}}}}
  /api/v1/account/totp/setup:
    post:
      tags: [account]
      summary: 生成待确认的 TOTP 密钥（已启用时 409）
      security: [{session: [], csrf: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [secret, uri], properties: {secret: {type: string}, uri: {type: string, description: otpauth:// 地址}}}}}}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/totp/enable:
    post:
      tags: [account]
      summary: 用一个验证码确认并启用；返回 10 个一次性恢复码（只显示这一次）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryCodes'}}}}, '401': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/totp/disable:
    post:
      tags: [account]
      summary: 关闭两步验证（需要口令）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/totp/recovery-codes:
    post:
      tags: [account]
      summary: 重新生成恢复码，旧码作废（需要口令）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryCodes'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/passkeys:
    get:
      tags: [account]
      summary: 本人的通行密钥；available 为 false 表示服务未配置对外地址，通行密钥不可用
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [items, available], properties: {items: {type: array, items: {$ref: '#/components/schemas/PasskeyInfo'}}, available: {type: boolean}}}}}}}
    post:
      tags: [account]
      summary: 完成注册（navigator.credentials.create 的结果，二进制字段为 base64url）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [ticket, credential], properties: {ticket: {type: string}, name: {type: string}, credential: {type: object, required: [clientDataJSON, attestationObject], properties: {clientDataJSON: {type: string}, attestationObject: {type: string}}}}}}}}
      responses: {'201': {description: 已添加, content: {application/json: {schema: {$ref: '#/components/schemas/PasskeyInfo'}}}}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}
