  /api/v1/import/preview:
    post:
      tags: [profiles]
      summary: 把完整的 Clash/mihomo 配置换算为导入计划（需求 R17），不写存储
      description: |
        返回要新建的节点源（sources，配置文档中以 "@" + key 占位）与配置文档 doc：proxies 成为一个整理全部关闭的手动节点源；
        type 为 http 的 proxy-providers 成为「交给客户端」的订阅节点源（名称不变）；proxy-groups、rule-providers、rules 与其他类型的 provider 原样写入直接编辑层；
        其余键按字段目录归入表单层，面板与外部控制设置不导入，未知键丢弃或按 keepUnknown 原样保留。每项去掉或改写的内容在 diagnostics 中（import.*）。
        不是 YAML 映射时 ok 为 false。受预览限流约束
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [text], properties: {text: {type: string}, name: {type: string}, keepUnknown: {type: boolean}}}}}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [ok, diagnostics]
                properties:
                  ok: {type: boolean}
                  doc: {type: string}
                  sources:
                    type: array
                    items:
                      type: object
                      required: [key, kind, name, processing, mode]
                      properties:
                        key: {type: string}
                        kind: {type: string, enum: [batch, subscription]}
                        name: {type: string}
                        url: {type: string}
                        content: {type: string}
                        ua: {type: string}
                        headers: {type: object, additionalProperties: {type: string}}
                        interval: {type: integer}
                        processing: {type: object}
                        mode: {type: string, enum: [inline, provider]}
                  counts: {type: object, properties: {proxies: {type: integer}, providers: {type: integer}, groups: {type: integer}, rules: {type: integer}, ruleProviders: {type: integer}, form: {type: integer}, raw: {type: integer}}}
                  diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/profiles/{id}/export-config:
    post:
      tags: [profiles]
      summary: 导出客户端可以直接使用的配置（需求 R17）
      description: |
        与订阅链接同源（同一渲染与内核检查）。nodes 为 false 时去掉 proxies 与 proxy-providers，组内引用一并去掉，没有成员的组写入 DIRECT 占位；
        rules 为 false 时去掉 rule-providers 与使用它们的规则。去掉与改写的内容在 diagnostics 中（export.*）。
        「交给客户端」的节点源需要订阅链接的令牌：用 link 指定的（或第一条）链接，配置没有链接时 409 export.needs_link。受预览与内核检查的限流约束，记入审计 profile.export
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {nodes: {type: boolean}, rules: {type: boolean}, link: {type: string, description: 订阅链接 ID}}}}}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [yaml, filename, diagnostics, kernel, fatal]
                properties:
                  yaml: {type: string}
                  filename: {type: string}
                  diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
                  kernel: {type: object, properties: {status: {type: string, enum: [passed, failed, unavailable, timeout]}, version: {type: string}, message: {type: string}, path: {type: string}}}
                  fatal: {type: string}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/profiles/{id}/links:
    get:
      tags: [links]
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/List'}}}}}
    post:
      tags: [links]
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {note: {type: string}}}}}}
      responses: {'201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/Link'}}}}}
  /api/v1/profiles/{id}/links/{lid}/reset:
    post:
      tags: [links]
      summary: 重置链接：生成新令牌，旧链接立即失效
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/lid'}, {$ref: '#/components/parameters/ifMatch'}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Link'}}}}, '412': {$ref: '#/components/responses/Problem'}}
  /api/v1/profiles/{id}/links/{lid}:
    patch:
      tags: [links]
      summary: 修改备注或访问限制（只改出现的字段）
      description: 访问限制（需求 R42）：clients 为允许的客户端名称（User-Agent 中第一个「名称/版本」的名称，不区分大小写，最多 20 个）；countries 为允许的国家或地区（两个字母，最多 60 个；查不到来源地区时视为不符合）；perDay 为每天最多成功拉取的次数（按所有者时区，0 表示不限）。不符合的客户端或地区返回 403，当天次数用完返回 429 与 Retry-After（到下一天零点）；托管节点文件只检查客户端与地区。限制变化记入审计 link.limits。
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/lid'}, {$ref: '#/components/parameters/ifMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {note: {type: string}, limits: {$ref: '#/components/schemas/LinkLimits'}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Link'}}}}}
    delete:
      tags: [links]
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/lid'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
