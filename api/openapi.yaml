openapi: 3.1.0
info:
  title: Clash, Launch! API
  version: 1.0.0
  description: |
    管理接口（/api/v1/）、订阅端点与健康检查。错误统一为 RFC 9457 application/problem+json，
    type 取诊断或错误代码。可修改的资源返回 ETag；修改时必须带 If-Match，版本不一致返回 412。
    认证使用会话 Cookie；除登录与设置外的写操作要求同源 Origin 与 X-CSRF-Token。
  license: {name: GPL-3.0-or-later, identifier: GPL-3.0-or-later}
servers: [{url: /}]
tags:
  - {name: subscription, description: 客户端使用的订阅端点}
  - {name: session}
  - {name: catalog}
  - {name: sources}
  - {name: rule-sources}
  - {name: profiles}
  - {name: routing, description: 分流地图、追踪与体检（docs/design/routing.md）}
  - {name: links}
  - {name: admin}
  - {name: account}
  - {name: events, description: 实时通道（需求 R22）}
  - {name: health}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: cl_session, description: HTTPS 下 Cookie 名为 __Host-cl_session}
    csrf: {type: apiKey, in: header, name: X-CSRF-Token}
    token: {type: http, scheme: bearer, description: 个人访问令牌（clt_…，需求 R25），见 POST /api/v1/account/tokens；不需要 CSRF，只能访问其中列出的接口}
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string}}
    lid: {name: lid, in: path, required: true, schema: {type: string}}
    pack: {name: pack, in: path, required: true, schema: {type: string, enum: [mihomo]}}
    token: {name: token, in: path, required: true, schema: {type: string}, description: 256 位随机令牌（base64url，43 个字符）}
    ifMatch: {name: If-Match, in: header, required: true, schema: {type: string}, description: 资源的 ETag，如 "v3"}
    cursor: {name: cursor, in: query, schema: {type: string}}
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
    lang: {name: lang, in: query, schema: {type: string, enum: [en, zh-CN]}}
  responses:
    Problem:
      description: 错误（RFC 9457）
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NoContent: {description: 成功，无内容}
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
    Diagnostic:
      type: object
      required: [code, severity]
      properties:
        code: {type: string}
        severity: {type: string, enum: [error, warning, info]}
        path: {type: string}
        args: {type: object, additionalProperties: {type: string}}
    RoutingGraph:
      type: object
      required: [state, editable, rules, groups, exits, pending, traceEnabled, checks, diagnostics]
      properties:
        state: {type: string, enum: [follow, own]}
        editable: {type: boolean}
        readonlyReason: {type: string, enum: [raw_override, no_rules]}
        rules: {type: array, items: {$ref: '#/components/schemas/RoutingRule'}}
        groups: {type: array, items: {$ref: '#/components/schemas/RoutingGroup'}}
        exits: {type: array, items: {$ref: '#/components/schemas/RoutingExit'}}
        pending: {type: integer, description: 正在后台拉取的规则集个数}
        traceEnabled: {type: boolean}
        checks: {type: array, items: {$ref: '#/components/schemas/RoutingCheck'}, description: 期望的结果（自己管理时）}
        upstreamChanges: {type: integer, description: 自己管理后规则源的变化数}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
    RoutingUpstream:
      type: object
      required: [changes, digest, groups, rulesets]
      properties:
        changes: {type: array, items: {$ref: '#/components/schemas/RoutingUpstreamChange'}}
        digest: {type: string, description: 上游当前内容的摘要；采纳或忽略后写入 routing.from.digest}
        groups: {type: array, items: {type: object, additionalProperties: true}}
        rulesets: {type: array, items: {type: object, additionalProperties: true}}
    RoutingUpstreamChange:
      type: object
      required: [id, kind, op, key, conflict]
      properties:
        id: {type: string}
        kind: {type: string, enum: [group, ruleset]}
        op: {type: string, enum: [add, remove, modify, move]}
        key: {type: string}
        field: {type: string}
        base: {}
        upstream: {}
        mine: {}
        conflict: {type: boolean, description: 用户也改过同一处，默认保留自己的}
    RoutingCheck:
      type: object
      required: [host, via, path]
      properties:
        host: {type: string}
        via: {type: string}
        ok: {type: boolean, description: 省略表示无法判断}
        path: {type: array, items: {type: string}}
    RoutingRule:
      type: object
      required: [index, raw, type, target, origin, flags]
      properties:
        index: {type: integer}
        raw: {type: string}
        type: {type: string}
        target: {type: string}
        origin: {type: string, enum: [routing, rules, raw]}
        entry: {type: integer, description: 对应 routing.rulesets 中的第几条（跟随上游时为开始管理后会得到的）；原始编辑的行没有}
        set: {$ref: '#/components/schemas/RoutingRuleSet'}
        flags: {type: array, items: {type: string, enum: [logic, sub-rule, process, no-resolve]}}
    RoutingRuleSet:
      type: object
      required: [name, behavior, format]
      properties:
        name: {type: string}
        behavior: {type: string}
        format: {type: string}
        url: {type: string}
        count: {type: integer}
        samples: {type: array, items: {type: object, required: [host, hit], properties: {host: {type: string}, hit: {type: integer}}}}
        description: {type: object, required: [source, repo, license, checked, text], properties: {source: {type: string}, repo: {type: string}, license: {type: string}, checked: {type: string}, text: {type: object, additionalProperties: {type: string}}}}
        stale: {type: boolean}
        bundle: {type: string, description: 所属合集}
    RoutingGroup:
      type: object
      required: [name, type, members, params, origin, lints]
      properties:
        name: {type: string}
        type: {type: string}
        members: {type: array, items: {type: object, required: [name, kind], properties: {name: {type: string}, kind: {type: string, enum: [group, node, builtin, provider]}, entry: {type: integer, description: 来自组的 rule 列表中的第几条；来自正则或选择器时省略}}}}
        use: {type: array, items: {type: string}}
        filter: {type: string}
        params: {type: object, properties: {url: {type: string}, interval: {type: integer}, tolerance: {type: integer}, lazy: {type: boolean}, strategy: {type: string}}}
        origin: {type: string, enum: [routing, rules, raw]}
        lints: {type: array, items: {type: string}}
    RoutingExit:
      type: object
      required: [name, kind]
      properties:
        name: {type: string}
        kind: {type: string, enum: [node, builtin, provider]}
        region: {type: string}
        regionName: {type: object, additionalProperties: {type: string}, description: 地区的中英文名（zh、en），取自地区表}
        source: {type: string}
        protocol: {type: string}
        via: {type: string}
        filter: {type: string}
    RoutingTraceExit:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string, enum: [node, builtin, provider, unknown]}
        name: {type: string}
        region: {type: string}
        via: {type: string}
    RoutingTrace:
      type: object
      required: [host, steps, hit, chain, exit]
      properties:
        host: {type: string}
        ip: {type: string}
        steps: {type: array, items: {type: object, required: [index, result], properties: {index: {type: integer}, result: {type: string, enum: [miss, hit, needs-ip, unknown]}, evidence: {type: string}, reason: {type: string}}}}
        hit: {type: integer}
        chain: {type: array, items: {type: object, required: [group, type, pick, candidates], properties: {group: {type: string}, type: {type: string}, pick: {type: string}, candidates: {type: array, items: {type: string}}}}}
        exit: {$ref: '#/components/schemas/RoutingTraceExit'}
        needsIp: {type: object, required: [at, candidates], properties: {at: {type: integer}, candidates: {type: array, items: {type: integer}}}}
        stale: {type: boolean}
    RoutingHealthItem:
      type: object
      required: [host, category, hit, rule, exit, uncertain]
      properties:
        host: {type: string}
        category: {type: string}
        hit: {type: integer}
        rule: {type: string}
        exit: {$ref: '#/components/schemas/RoutingTraceExit'}
        uncertain: {type: boolean}
    User:
      type: object
      required: [id, username, role]
      properties:
        id: {type: string}
        username: {type: string}
        role: {type: string, enum: [admin, user]}
        lang: {type: string}
        timezone: {type: string}
        nickname: {type: string, description: 昵称，可含空格、不唯一（需求 R5）}
        nextRenameAt: {type: string, format: date-time, description: 下次可以改用户名的时间；为空表示现在就可以（需求 R4）}
        invitedBy: {type: string, description: 邀请人的用户名（需求 R12）}
    Session:
      type: object
      required: [user, csrf, terms, mfaSetup]
      properties:
        user: {$ref: '#/components/schemas/User'}
        csrf: {type: string}
        logoutAt: {type: string, format: date-time, description: 当前设备的定时退出时间（需求 R8）}
        terms: {$ref: '#/components/schemas/TermsState'}
        mfaSetup: {type: boolean, description: 两步验证策略要求本账号启用而尚未启用（需求 R41）}
        deletionCanceled: {type: boolean, description: 这次登录撤销了冷静期内的注销（需求 R20）}
    Snapshot:
      type: object
      properties:
        fetchedAt: {type: string, format: date-time}
        lastAttempt: {type: string, format: date-time}
        lastError: {type: string}
        failingSince: {type: string, format: date-time}
        hash: {type: string}
    Source:
      type: object
      required: [id, name, kind, interval, processing, version, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [single, batch, subscription, file]}
        url: {type: string}
        content: {type: string}
        ua: {type: string}
        headers: {type: object, additionalProperties: {type: string}}
        interval: {type: integer}
        processing: {type: object}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        snapshot: {$ref: '#/components/schemas/Snapshot'}
    SourceInput:
      type: object
      required: [name, kind]
      properties:
        name: {type: string}
        kind: {type: string, enum: [single, batch, subscription, file]}
        url: {type: string}
        content: {type: string}
        ua: {type: string}
        headers: {type: object, additionalProperties: {type: string}}
        interval: {type: integer}
        processing: {type: object}
    Node:
      type: object
      required: [name, type, server, port, fingerprint, region, rate, origin]
      properties:
        name: {type: string}
        type: {type: string}
        server: {type: string, description: 已打码}
        port: {type: integer}
        fingerprint: {type: string}
        region:
          type: object
          properties:
            code: {type: string}
            kind: {type: string, enum: [flag, keyword, route, manual, rule, unknown]}
            match: {type: string}
            ignored: {type: array, items: {type: string}}
            inferred: {type: boolean}
        emoji: {type: string}
        tags: {type: array, items: {type: string}}
        rate: {type: number}
        origin: {type: string}
    RuleSource:
      type: object
      required: [id, name, kind, interval, version, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [toml, ini]}
        preset: {type: string}
        groupsUrl: {type: string}
        rulesetsUrl: {type: string}
        iniUrl: {type: string}
        groupsText: {type: string}
        rulesetsText: {type: string}
        iniText: {type: string}
        interval: {type: integer}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RuleSourceInput:
      type: object
      required: [name, kind]
      properties:
        name: {type: string}
        kind: {type: string, enum: [toml, ini]}
        preset: {type: string}
        groupsUrl: {type: string}
        rulesetsUrl: {type: string}
        iniUrl: {type: string}
        groupsText: {type: string}
        rulesetsText: {type: string}
        iniText: {type: string}
        interval: {type: integer}
    RenderState:
      type: object
      required: [status, diagnostics]
      properties:
        status: {type: string, enum: [ok, failed, pending]}
        error: {type: string}
        goodAt: {type: string, format: date-time}
        lastAt: {type: string, format: date-time}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
    Profile:
      type: object
      required: [id, name, doc, version, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        doc: {type: string, description: 方案文档（clash-launch/profile v1）}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        protected: {type: boolean, description: 删除保护（需求 R55）；为 true 时删除返回 409 profile.protected}
        render: {$ref: '#/components/schemas/RenderState'}
    ProfileInput:
      type: object
      required: [doc]
      properties:
        doc: {type: string}
        note: {type: string}
        autosave: {type: boolean, description: 编辑器自动保存（只在更新时有效）；与上一个自动保存版本相隔不到 10 分钟时合并为同一个版本，备注为 autosave}
    Revision:
      type: object
      required: [n, doc, createdAt]
      properties:
        n: {type: integer}
        note: {type: string}
        doc: {type: string}
        createdAt: {type: string, format: date-time}
    Preview:
      type: object
      required: [yaml, diagnostics, touched, kernel, diff, numbering, chains, outbounds, nodes]
      properties:
        yaml: {type: string}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        touched: {type: array, items: {type: string}, description: 来自原始编辑的路径（⚡）}
        kernel:
          type: object
          properties:
            status: {type: string, enum: [passed, failed, unavailable, timeout]}
            version: {type: string}
            message: {type: string}
            path: {type: string}
        fatal: {type: string}
        nodes: {type: integer, description: 写入配置的节点数}
        numbering:
          type: array
          description: 订阅的编号（GROUPID），按方案中的顺序
          items: {type: object, required: [ref, name, groupId], properties: {ref: {type: string}, name: {type: string}, groupId: {type: integer}}}
        chains:
          type: array
          description: 每条链式代理规则实际套用到的节点与 provider，按方案中的顺序
          items: {type: object, required: [via, nodes, providers], properties: {via: {type: string}, nodes: {type: array, items: {type: string}}, providers: {type: array, items: {type: string}}}}
        outbounds: {type: array, items: {type: string}, description: 可作前置的名字（写入配置的节点与策略组）}
        diff:
          type: array
          items:
            type: object
            required: [op, text]
            properties:
              op: {type: string, enum: [' ', '-', '+']}
              text: {type: string}
    Link:
      type: object
      required: [id, url, note, createdAt, version, limits]
      properties:
        id: {type: string}
        url: {type: string}
        note: {type: string}
        createdAt: {type: string, format: date-time}
        lastAccess: {type: string, format: date-time}
        lastUa: {type: string}
        version: {type: integer}
        limits: {$ref: '#/components/schemas/LinkLimits'}
    LinkLimits:
      type: object
      description: 订阅链接的访问限制（需求 R42）；空列表或 0 表示该项不限制
      properties:
        clients: {type: array, maxItems: 20, items: {type: string}}
        countries: {type: array, maxItems: 60, items: {type: string, pattern: '^[A-Za-z]{2}$'}}
        perDay: {type: integer, minimum: 0, maximum: 100000}
    Invite:
      type: object
      required: [id, note, createdAt, status, maxUses, uses]
      properties:
        id: {type: string}
        url: {type: string, description: 只在创建时返回；令牌只以哈希存储}
        note: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        usedAt: {type: string, format: date-time}
        maxUses: {type: integer, description: 可用次数上限}
        uses: {type: integer}
        status: {type: string, enum: [active, used, expired, revoked]}
        createdBy: {type: string, description: 管理员视图：发出者的用户名}
        usedBy: {type: array, items: {type: string}, description: 用这个邀请注册的人（用户名）}
    InvitePolicy:
      type: object
      required: [perMonth, minAgeDays]
      properties:
        perMonth: {type: integer, minimum: 0, maximum: 1000, description: 普通用户最近 30 天可发出的邀请数；0 表示普通用户不能邀请}
        minAgeDays: {type: integer, minimum: 0, maximum: 3650}
    InviteQuota:
      type: object
      required: [unlimited, limit, used, allowed]
      properties:
        unlimited: {type: boolean}
        limit: {type: integer}
        used: {type: integer}
        allowed: {type: boolean}
        reason: {type: string, enum: [banned, too_new, quota, disabled]}
        availableAt: {type: string, format: date-time}
    Invitee:
      type: object
      required: [username, joinedAt]
      properties:
        username: {type: string}
        nickname: {type: string}
        joinedAt: {type: string, format: date-time}
    Prefs:
      type: object
      additionalProperties: false
      properties:
        nav: {type: array, maxItems: 64, items: {type: string}, description: 主菜单顺序（路由 ID）；未列出的项按默认顺序排在后面}
        sections: {type: array, maxItems: 64, items: {type: string}, description: 内核设置分节顺序（目录分节 ID）}
        fieldClick: {type: string, enum: [button, text, card], description: 「说明与建议」的点击范围：只有按钮、说明文字或整张卡片；省略为 card}
        autoCheck: {type: boolean, description: 自动保存后自动执行 mihomo -t 检查；省略为开}
        motion: {type: string, enum: [off], description: off 关闭界面动效（与系统的减少动态效果相同）；省略为跟随系统}
        routingView: {type: object, additionalProperties: false, description: 分流地图的显示偏好（routing 第 9 节）, properties: {rules: {type: string, enum: [auto, all]}, particles: {type: string, enum: [all, focus, off]}, candidates: {type: boolean}, exits: {type: string, enum: [auto, node, region, source]}}}
    Terms:
      type: object
      required: [version, texts, custom]
      properties:
        version: {type: integer, description: 当前版本；每次改写或恢复默认加一}
        texts: {type: object, additionalProperties: {type: string}, description: 按语言（zh-CN、en）的 Markdown 文本}
        custom: {type: boolean, description: 管理员改写过}
        updatedAt: {type: string, format: date-time}
    TermsState:
      type: object
      required: [accepted, current, pending]
      properties:
        accepted: {type: integer, description: 用户同意的版本；0 表示尚未同意}
        current: {type: integer}
        pending: {type: boolean, description: 需要先同意才能继续使用}
    AccessToken:
      type: object
      required: [id, name, scope, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        scope: {type: string, enum: [read, write]}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
        lastIp: {type: string}
        token: {type: string, description: 明文，只在创建的响应中出现}
    Channel:
      type: object
      description: 提醒渠道（需求 R31）。不返回令牌、设备 key、签名密钥与 Webhook 地址，只返回是否已设置与主机名
      required: [id, kind, name, hasToken, hasKey, hasSecret, enabled, createdAt]
      properties:
        id: {type: string}
        kind: {type: string, enum: [webhook, telegram, bark, ntfy]}
        name: {type: string}
        host: {type: string, description: webhook 的主机名}
        url: {type: string, description: bark、ntfy 的服务器地址}
        chat: {type: string}
        topic: {type: string}
        hasToken: {type: boolean}
        hasKey: {type: boolean}
        hasSecret: {type: boolean}
        enabled: {type: boolean, description: 测试消息送达后为 true；修改设置后回到 false}
        verifiedAt: {type: string, format: date-time}
        lastAt: {type: string, format: date-time}
        lastError: {type: string, description: 最近一次发送失败的原因（已分类，不含地址与令牌）}
        createdAt: {type: string, format: date-time}
    ChannelInput:
      type: object
      description: |
        webhook：url（https）、secret（可选，附带 X-Timestamp 与 X-Signature-256 签名头）；telegram：token、chat；
        bark：url（服务器地址）、key；ntfy：url（服务器地址）、topic、token（可选）。修改时 token、key、secret 与 webhook 的 url 留空表示保留原值
      required: [kind]
      properties:
        name: {type: string, maxLength: 40}
        kind: {type: string, enum: [webhook, telegram, bark, ntfy]}
        url: {type: string}
        token: {type: string}
        chat: {type: string}
        key: {type: string}
        topic: {type: string}
        secret: {type: string}
    MFAPolicy:
      type: object
      required: [policy]
      properties:
        policy: {type: string, enum: ['off', admins, all]}
    PulseSettings:
      type: object
      required: [showOnline]
      properties:
        showOnline: {type: boolean, description: 是否向普通用户显示在线人数}
    NodeMode:
      type: object
      required: [default, locked, clientFetch]
      properties:
        default: {type: string, enum: [inline, provider], description: 管理员设定的默认写法；新加入配置的源使用它}
        locked: {type: boolean, description: 为 true 时只能使用默认写法（开放注册的普通用户），生成时覆盖文档中的写法并报告 profile.mode_locked}
        clientFetch: {type: boolean, description: 为 true 时订阅只由客户端拉取，服务器不访问订阅地址（锁定且默认写法为 provider）；手动拉取返回 409 source.client_fetch}
    Registration:
      type: object
      required: [open]
      properties:
        open: {type: boolean, description: 是否允许无邀请注册（默认关闭）}
    PoWChallenge:
      type: object
      required: [challenge, bits]
      properties:
        challenge: {type: string, description: 签名的挑战，5 分钟有效，只能使用一次}
        bits: {type: integer, description: 要求 SHA-256(challenge ":" nonce) 的前导零位数}
    PoWProof:
      type: object
      required: [challenge, nonce]
      properties:
        challenge: {type: string}
        nonce: {type: string, description: 十进制整数}
    Question:
      type: object
      required: [builtin]
      properties:
        builtin: {type: integer, description: 内置问题编号 0–9；-1 表示自定义}
        text: {type: string, description: 自定义问题的文字}
    Questions:
      type: object
      required: [questions]
      properties:
        questions: {type: array, items: {$ref: '#/components/schemas/Question'}}
    SessionInfo:
      type: object
      required: [id, device, ua, ip, createdAt, lastSeen, expiresAt, idleUntil, current]
      properties:
        id: {type: string}
        device: {type: string, description: 浏览器与系统的粗略归类}
        ua: {type: string}
        ip: {type: string, description: IP 前缀（IPv4 /24、IPv6 /48）}
        location:
          type: object
          description: 登录时由本地地理库得出的所在地（需求 R7）；省市与运营商按数据库原文
          properties: {cc: {type: string, description: ISO 3166-1 国家代码}, region: {type: string}, city: {type: string}, isp: {type: string}}
        createdAt: {type: string, format: date-time}
        lastSeen: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: 自然到期时间（登录满 30 天）}
        idleUntil: {type: string, format: date-time, description: 闲置到这个时间会失效（随使用后延）}
        logoutAt: {type: string, format: date-time, description: 定时退出的时间（需求 R8）}
        current: {type: boolean}
    TOTPStatus:
      type: object
      required: [enabled, remainingCodes]
      properties:
        enabled: {type: boolean}
        remainingCodes: {type: integer}
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes: {type: array, items: {type: string}}
    MFAChallenge:
      type: object
      required: [mfa, ticket]
      description: 密码正确但需要第二因素时的登录响应（不设置会话）
      properties:
        mfa: {type: array, items: {type: string, enum: [totp, passkey]}}
        ticket: {type: string}
    PasskeyInfo:
      type: object
      required: [id, name, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time}
        lastUsed: {type: string, format: date-time}
    WebAuthnBegin:
      type: object
      required: [options, ticket]
      properties:
        options: {type: object, description: WebAuthn 选项，二进制字段为 base64url}
        ticket: {type: string, description: 签名的挑战凭证，5 分钟有效，只能使用一次}
    SMTPInput:
      type: object
      required: [host, port, security, from, to]
      properties:
        host: {type: string}
        port: {type: integer, enum: [25, 465, 587]}
        security: {type: string, enum: [tls, starttls], description: tls 为隐式 TLS（465）；starttls 要求服务器支持 STARTTLS}
        username: {type: string}
        password: {type: string}
        from: {type: string, description: 只填邮箱地址}
        to: {type: string}
    SMTPSettings:
      allOf:
        - {$ref: '#/components/schemas/SMTPInput'}
        - type: object
          required: [hasPassword, enabled]
          properties:
            hasPassword: {type: boolean}
            enabled: {type: boolean}
            verifiedAt: {type: string, format: date-time}
    AuditEntry:
      type: object
      required: [id, at, action, detail]
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        action: {type: string}
        detail: {type: object}
        user: {type: string, description: 管理员视图中的账号名}
    Limits:
      type: object
      required: [sources, profiles, links, minInterval, storage]
      properties:
        sources: {type: integer}
        profiles: {type: integer}
        links: {type: integer}
        minInterval: {type: integer, description: 秒}
        storage: {type: integer, description: 字节}
    Usage:
      type: object
      required: [sources, profiles, links, bytes]
      properties:
        sources: {type: integer}
        profiles: {type: integer}
        links: {type: integer}
        bytes: {type: integer, description: 加密后保存的内容字节数}
    AdminUser:
      type: object
      required: [id, username, role, disabled, createdAt, mfa, usage, quota]
      properties:
        deletionAt: {type: string, format: date-time, description: 冷静期内的计划注销时间（需求 R20）}
        deleted: {type: boolean, description: 已注销}
        id: {type: string}
        username: {type: string}
        role: {type: string}
        disabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        mfa: {type: boolean}
        usage: {$ref: '#/components/schemas/Usage'}
        quota: {allOf: [{$ref: '#/components/schemas/Limits'}], description: 单独设置的配额，-1 表示使用默认值}
    Template:
      type: object
      required: [id, name, note, doc, default, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        note: {type: string, description: 说明，如适用的客户端与 mihomo 版本}
        doc: {type: string, description: 配置文档（新建配置时替换其中的名称）}
        default: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TemplateInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        note: {type: string, maxLength: 500}
        doc: {type: string}
        default: {type: boolean}
    List:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {}}
        next: {type: string}
paths:
  /healthz:
    get: {tags: [health], summary: 存活检查, responses: {'200': {description: ok}}}
  /readyz:
    get: {tags: [health], summary: 就绪检查（数据库可用）, responses: {'200': {description: ready}, '503': {$ref: '#/components/responses/Problem'}}}
  /metrics:
    get:
      tags: [health]
      summary: 运行指标（Prometheus 文本格式 0.0.4，需求 R26）
      description: |
        请求数与耗时（按路由模式）、配置生成耗时、数据库语句耗时、拉取结果、后台任务、实时在线人数与 Go 运行时。不含用户数据。
        设置了 CLASH_LAUNCH_METRICS_TOKEN 时凭 Authorization: Bearer <令牌> 访问；否则只接受直接来自本机或内网、且不带转发头的请求。其余一律 404
      responses: {'200': {description: text/plain; version=0.0.4}, '404': {description: 不可访问}}
  /s/{token}:
    get:
      tags: [subscription]
      summary: 方案最近一次成功的渲染结果
      description: 只读缓存，不触发拉取或渲染。支持 If-None-Match；按 IP 与令牌限流（默认每分钟 30 次）。
      parameters: [{$ref: '#/components/parameters/token'}, {name: download, in: query, schema: {type: string}, description: 非空时作为文件下载（导出）：附带文件名、总是返回完整内容，请求记录中记为 export}]
      responses:
        '200':
          description: text/yaml；附 Content-Disposition、profile-update-interval、可选的 subscription-userinfo 与 profile-web-page-url
          content: {text/yaml: {schema: {type: string}}}
        '304': {description: 未修改}
        '404': {description: 令牌无效}
        '429': {description: 超出频率限制，带 Retry-After}
        '503': {description: 尚无成功的渲染结果（正文是一段 YAML 注释）}
  /p/{token}/{source}:
    get:
      tags: [subscription]
      summary: 「交给客户端」模式下由本服务托管的节点文件
      parameters: [{$ref: '#/components/parameters/token'}, {name: source, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: text/yaml（proxies 列表）}, '404': {description: 不存在}, '429': {description: 超出频率限制}}
  /api/v1/setup:
    get:
      tags: [session]
      summary: 是否还需要创建首个管理员（没有任何账号时为 true）
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [needed], properties: {needed: {type: boolean}}}}}}}
    post:
      tags: [session]
      summary: 没有任何账号时创建首个管理员；已有账号后返回 403
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username, password], properties: {username: {type: string}, password: {type: string}}}}}}
      responses: {'201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/session:
    post:
      tags: [session]
      summary: 登录
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username, password], properties: {username: {type: string}, password: {type: string}}}}}}
      responses: {'200': {description: 已登录并设置会话 Cookie；启用了第二因素时返回 MFAChallenge 而不设置会话, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Session'}, {$ref: '#/components/schemas/MFAChallenge'}]}}}}, '401': {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [session]
      summary: 登出
      security: [{session: [], csrf: []}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/me:
    get:
      tags: [session]
      summary: 当前用户与 CSRF 令牌
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '401': {$ref: '#/components/responses/Problem'}}
  /api/v1/node-mode:
    get:
      tags: [session]
      summary: 当前用户的节点写法策略：默认写法与能否在配置中自选（开放注册的普通用户只能用默认写法）
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/NodeMode'}}}}}
  /api/v1/stats/events:
    post:
      tags: [stats]
      summary: 上报使用事件（visit 打开网站、pv 切换页面、field_change 改值、field_expand 展开说明）；服务端去重，只按天汇总计数
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [events], properties: {events: {type: array, maxItems: 50, items: {type: object, required: [kind], properties: {kind: {type: string, enum: [visit, pv, field_change, field_expand]}, key: {type: string}}}}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Problem'}}
  /api/v1/stats/field-scores:
    get:
      tags: [stats]
      summary: 设置项热度快照（改值计 2、展开说明计 1，每周重算一次）
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {computedAt: {type: string, format: date-time}, scores: {type: object, additionalProperties: {type: integer}}}}}}}}
  /api/v1/terms:
    get:
      tags: [session]
      summary: 当前的用户协议（公开）：版本与按语言的文本（Markdown，保留期占位符已替换为本站设置）
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Terms'}}}}}
  /api/v1/account/terms:
    post:
      tags: [account]
      summary: 同意或拒绝当前版本的用户协议
      description: 普通用户同意的版本低于当前版本时，除 GET /api/v1/me、本接口与 DELETE /api/v1/session 外，已登录接口一律返回 403 terms.required。拒绝只记入审计（account.terms_decline），页面随后退出登录。
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [version, accept], properties: {version: {type: integer}, accept: {type: boolean}}}}}}
      responses: {'200': {description: 已同意, content: {application/json: {schema: {$ref: '#/components/schemas/TermsState'}}}}, '204': {$ref: '#/components/responses/NoContent'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/register:
    get:
      tags: [session]
      summary: 注册是否开放（注册页据此决定是否要求邀请）
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Registration'}}}}}
    post:
      tags: [session]
      summary: 注册普通用户；注册关闭时需要有效的一次性邀请。按 IP 限速
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username, password, questions, answers, pow, terms], properties: {username: {type: string}, password: {type: string}, invite: {type: string}, questions: {type: array, items: {$ref: '#/components/schemas/Question'}, minItems: 3, maxItems: 3}, answers: {type: array, items: {type: string}, minItems: 3, maxItems: 3}, pow: {$ref: '#/components/schemas/PoWProof'}, terms: {type: integer, description: 勾选同意的用户协议版本（需求 R40），必须是当前版本，否则 409 terms.outdated}}}}}}
      responses: {'201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {description: 用户名已存在}, '422': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/pow:
    get:
      tags: [session]
      summary: 工作量证明挑战（注册与找回前在浏览器中求解，约 1 秒）
      parameters: [{name: purpose, in: query, required: true, schema: {type: string, enum: [register, recover]}}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/PoWChallenge'}}}}, '400': {$ref: '#/components/responses/Problem'}}
  /api/v1/recovery/questions:
    post:
      tags: [session]
      summary: 找回时显示的安全问题；用户不存在时返回稳定的诱饵问题。按 IP 限速
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username], properties: {username: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Questions'}}}}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/recovery:
    post:
      tags: [session]
      summary: 答对至少 2 个安全问题后重设密码；该账号的全部会话失效。连续失败后锁定 15 分钟
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username, answers, password, pow], properties: {username: {type: string}, answers: {type: array, items: {type: string}, minItems: 3, maxItems: 3}, password: {type: string}, pow: {$ref: '#/components/schemas/PoWProof'}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/questions:
    get:
      tags: [account]
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Questions'}}}}}
    put:
      tags: [account]
      summary: 替换安全问题（需要当前密码）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password, questions, answers], properties: {password: {type: string}, questions: {type: array, items: {$ref: '#/components/schemas/Question'}}, answers: {type: array, items: {type: string}}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/password:
    put:
      tags: [account]
      summary: 修改密码；可同时注销其他设备
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [current, password], properties: {current: {type: string}, password: {type: string}, logoutOthers: {type: boolean}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/prefs:
    get:
      tags: [account]
      summary: 界面偏好（菜单与分节顺序）
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Prefs'}}}}}
    put:
      tags: [account]
      summary: 保存界面偏好；未知键、重复或超限的项返回 400
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Prefs'}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Prefs'}}}}, '400': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/timezone:
    put:
      tags: [account]
      summary: 保存时区（IANA 名称；空字符串表示跟随浏览器）。界面时间按它显示，配置未指定时区时文件头时间也按它显示
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [timezone], properties: {timezone: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {timezone: {type: string}}}}}}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/sessions:
    get:
      tags: [account]
      summary: 当前登录的设备
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SessionInfo'}}}}}}}}
  /api/v1/account/sessions/{id}:
    delete:
      tags: [account]
      summary: 注销一个设备
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/sessions/{id}/logout-at:
    put:
      tags: [account]
      summary: 设定或取消（at 为 null）定时退出；id 为 others 时作用于除当前设备外的全部设备。时间至少在一分钟后，且早于该设备的自然到期
      security: [{session: [], csrf: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [at], properties: {at: {type: [string, "null"], format: date-time}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [updated], properties: {updated: {type: integer}}}}}}, '404': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/session/totp:
    post:
      tags: [session]
      summary: 登录第二步：用 TOTP 验证码或恢复码完成登录（凭证来自密码登录的响应，5 分钟有效）
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [ticket, code], properties: {ticket: {type: string}, code: {type: string}}}}}}
      responses: {'200': {description: 已登录, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '401': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/totp:
    get:
      tags: [account]
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/TOTPStatus'}}}}}
  /api/v1/account/totp/setup:
    post:
      tags: [account]
      summary: 生成待确认的 TOTP 密钥（已启用时 409）
      security: [{session: [], csrf: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [secret, uri], properties: {secret: {type: string}, uri: {type: string, description: otpauth:// 地址}}}}}}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/totp/enable:
    post:
      tags: [account]
      summary: 用一个验证码确认并启用；返回 10 个一次性恢复码（只显示这一次）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [code], properties: {code: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryCodes'}}}}, '401': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/totp/disable:
    post:
      tags: [account]
      summary: 关闭两步验证（需要密码）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/totp/recovery-codes:
    post:
      tags: [account]
      summary: 重新生成恢复码，旧码作废（需要密码）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/RecoveryCodes'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/passkeys:
    get:
      tags: [account]
      summary: 本人的通行密钥；available 为 false 表示服务未配置对外地址，通行密钥不可用
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [items, available], properties: {items: {type: array, items: {$ref: '#/components/schemas/PasskeyInfo'}}, available: {type: boolean}}}}}}}
    post:
      tags: [account]
      summary: 完成注册（navigator.credentials.create 的结果，二进制字段为 base64url）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [ticket, credential], properties: {ticket: {type: string}, name: {type: string}, credential: {type: object, required: [clientDataJSON, attestationObject], properties: {clientDataJSON: {type: string}, attestationObject: {type: string}}}}}}}}
      responses: {'201': {description: 已添加, content: {application/json: {schema: {$ref: '#/components/schemas/PasskeyInfo'}}}}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/passkeys/begin:
    post:
      tags: [account]
      summary: 开始注册：返回 PublicKeyCredentialCreationOptions（JSON 形式）与 5 分钟有效的凭证
      security: [{session: [], csrf: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/WebAuthnBegin'}}}}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/passkeys/{id}:
    patch:
      tags: [account]
      summary: 重命名
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/passkeys/{id}/delete:
    post:
      tags: [account]
      summary: 删除（需要密码）
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/session/passkey/begin:
    post:
      tags: [session]
      summary: 开始通行密钥登录。带 ticket（密码登录返回的第二步凭证）时用作第二步，否则为免密码登录
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {ticket: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/WebAuthnBegin'}}}}, '409': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/session/passkey:
    post:
      tags: [session]
      summary: 用通行密钥完成登录（navigator.credentials.get 的结果）
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [ticket, credential], properties: {ticket: {type: string}, credential: {type: object, required: [id, clientDataJSON, authenticatorData, signature], properties: {id: {type: string}, clientDataJSON: {type: string}, authenticatorData: {type: string}, signature: {type: string}, userHandle: {type: string}}}}}}}}
      responses: {'200': {description: 已登录, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '401': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/smtp:
    get:
      tags: [account]
      summary: 提醒邮件设置（不含密码）；settings 为 null 表示未设置，available 为 false 表示服务不提供邮件提醒
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [available], properties: {available: {type: boolean}, settings: {oneOf: [{$ref: '#/components/schemas/SMTPSettings'}, {type: 'null'}]}}}}}}}
    put:
      tags: [account]
      summary: 保存设置（回到未验证状态，需要再发送测试邮件）；password 为空表示保留原密码
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SMTPInput'}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [account]
      security: [{session: [], csrf: []}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/account/smtp/test:
    post:
      tags: [account]
      summary: 发送测试邮件；成功后启用提醒。每个用户每小时最多 5 次
      security: [{session: [], csrf: []}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/backup:
    post:
      tags: [account]
      summary: 下载个人全部信息的加密备份（需求 R21）
      description: |
        包含账号资料（昵称、语言、时区、偏好）、节点源、规则源、配置与修订历史、模板、订阅链接与短链接（含令牌）、提醒邮件与提醒渠道。
        不含用户名、密码、两步验证、通行密钥、登录设备、访问令牌、消息、好友与授权。文件用 passphrase（至少 10 个字符）经 argon2id 派生的密钥以 AES-256-GCM 加密。需要当前密码；记入审计 account.backup
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password, passphrase], properties: {password: {type: string}, passphrase: {type: string, minLength: 10}}}}}}
      responses: {'200': {description: 备份文件（application/octet-stream）}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/delete:
    post:
      tags: [account]
      summary: 发起注销（需求 R20）
      description: |
        需要当前密码，启用了两步验证时还要 code。进入 7 天冷静期：所有会话与访问令牌立即失效，冷静期内再次登录即撤销（登录响应 deletionCanceled 为 true）；
        到期后删除全部数据，订阅链接与短链接失效，给别人的授权收回并通知对方；对话保留，用户名改为 deleted-…，原用户名保留 180 天。
        用户协议待同意或两步验证待设置时也可以调用。最后一个可用的管理员 409 account.last_admin
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string}, code: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {at: {type: string, format: date-time}}}}}}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/restore/preview:
    post:
      tags: [account]
      summary: 还原前比较当前账号与备份的内容数量
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [file, passphrase], properties: {file: {type: string, description: 备份文件原文}, passphrase: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {current: {type: object, properties: {sources: {type: integer}, ruleSources: {type: integer}, profiles: {type: integer}, revisions: {type: integer}, templates: {type: integer}, links: {type: integer}, shortLinks: {type: integer}, channels: {type: integer}, smtp: {type: boolean}, createdAt: {type: string, format: date-time}, server: {type: string}}}, backup: {type: object, properties: {sources: {type: integer}, ruleSources: {type: integer}, profiles: {type: integer}, revisions: {type: integer}, templates: {type: integer}, links: {type: integer}, shortLinks: {type: integer}, channels: {type: integer}, smtp: {type: boolean}, createdAt: {type: string, format: date-time}, server: {type: string}}}}}}}}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/restore:
    post:
      tags: [account]
      summary: 用备份整体覆盖当前账号的个人数据（需求 R21）
      description: |
        覆盖前自动为当前状态留底，保存 7 天，可经 /account/restore/undo 撤销。ID、令牌与短码沿用备份里的，订阅因此不断；已被其他账号使用时换新的并列在结果中。
        还原后不再存在的节点源与为好友生成的短链接，授权被收回并通知对方（R2）。口令错误或文件损坏 422 backup.passphrase；需要当前密码；记入审计 account.restore
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [file, passphrase, password], properties: {file: {type: string}, passphrase: {type: string}, password: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {summary: {type: object, properties: {sources: {type: integer}, ruleSources: {type: integer}, profiles: {type: integer}, revisions: {type: integer}, templates: {type: integer}, links: {type: integer}, shortLinks: {type: integer}, channels: {type: integer}, smtp: {type: boolean}, createdAt: {type: string, format: date-time}, server: {type: string}}}, newTokens: {type: array, items: {type: string}, description: 因令牌已被其他账号使用而换新的订阅链接（备注）}, newCodes: {type: array, items: {type: string}, description: 原短码 → 新短码}, revoked: {type: integer}, undoUntil: {type: string, format: date-time}}}}}}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/restore/undo:
    get:
      tags: [account]
      summary: 是否可以撤销最近一次还原
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [available], properties: {available: {type: boolean}, createdAt: {type: string, format: date-time}, expiresAt: {type: string, format: date-time}}}}}}}
    post:
      tags: [account]
      summary: 撤销最近一次还原：用自动留底覆盖回去，随后删除留底（需要当前密码；记入审计 account.restore_undo）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {summary: {type: object, properties: {sources: {type: integer}, ruleSources: {type: integer}, profiles: {type: integer}, revisions: {type: integer}, templates: {type: integer}, links: {type: integer}, shortLinks: {type: integer}, channels: {type: integer}, smtp: {type: boolean}, createdAt: {type: string, format: date-time}, server: {type: string}}}, newTokens: {type: array, items: {type: string}, description: 因令牌已被其他账号使用而换新的订阅链接（备注）}, newCodes: {type: array, items: {type: string}, description: 原短码 → 新短码}, revoked: {type: integer}, undoUntil: {type: string, format: date-time}}}}}}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/channels:
    get:
      tags: [account]
      summary: 本人的提醒渠道；available 为 false 时服务没有启用推送
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Channel'}}, available: {type: boolean}, kinds: {type: array, items: {type: string}}, max: {type: integer}}}}}}}
    post:
      tags: [account]
      summary: 新建提醒渠道（未启用，需要再发送测试消息）。每人最多 5 个；地址只允许 https 并经 SSRF 防护
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelInput'}}}}
      responses: {'201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/Channel'}}}}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/channels/{id}:
    put:
      tags: [account]
      summary: 修改提醒渠道（种类不能改）；修改后回到未验证
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChannelInput'}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Channel'}}}}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [account]
      summary: 删除提醒渠道
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/channels/{id}/test:
    post:
      tags: [account]
      summary: 发送测试消息；送达后启用。失败时 422 push.failed，原因同时记在渠道上。与测试邮件共用每小时 5 次
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Channel'}}}}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/tokens:
    get:
      tags: [account]
      summary: 本人的个人访问令牌（不含明文）
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AccessToken'}}}}}}}}
    post:
      tags: [account]
      summary: 生成个人访问令牌；明文 token 只在这次响应中出现（记入审计 token.create，并发送安全提醒）
      description: |
        令牌以 Authorization: Bearer clt_… 使用，不需要 CSRF。read 只能读取，write 还能修改；能访问节点源、规则源、配置、订阅链接、模板、短链接、订阅分析、节点写法、配额与 GET /api/v1/me，
        账号安全（密码、两步验证、通行密钥、会话、令牌本身）、消息与授权、实时通道和管理接口一律 403 token.forbidden。每人最多 20 个；days 为 0 表示不过期。
        找回密码或管理员重设密码时全部吊销；账号停用后不可用；用户协议与两步验证策略的拦截同样适用。
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, scope], properties: {name: {type: string, maxLength: 64}, scope: {type: string, enum: [read, write]}, days: {type: integer, minimum: 0, maximum: 3650}}}}}}
      responses: {'201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/AccessToken'}}}}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/tokens/{id}:
    delete:
      tags: [account]
      summary: 吊销一个令牌（记入审计 token.revoke）
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/audit:
    get:
      tags: [account]
      summary: 与本人有关的审计记录（新的在前）
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/cursor'}, {$ref: '#/components/parameters/limit'}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}, next: {type: string}}}}}}}
  /api/v1/account/quota:
    get:
      tags: [account]
      summary: 本人的配额与用量（-1 表示不限制）
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [limits, usage], properties: {limits: {$ref: '#/components/schemas/Limits'}, usage: {$ref: '#/components/schemas/Usage'}}}}}}}
  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: 用户的元数据与用量（不含任何内容）
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/cursor'}, {$ref: '#/components/parameters/limit'}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [items, defaults], properties: {items: {type: array, items: {$ref: '#/components/schemas/AdminUser'}}, defaults: {$ref: '#/components/schemas/Limits'}}}}}}, '404': {description: 不是管理员}}
  /api/v1/admin/jobs:
    get:
      tags: [admin]
      summary: 后台任务的运行情况（需求 R36）；数据在内存中，重启后从零开始
      security: [{session: []}]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: {type: array, items: {type: object, required: [name, runs, failures, lastStart, lastMs, running], properties: {name: {type: string}, runs: {type: integer}, failures: {type: integer}, lastStart: {type: string, format: date-time}, lastMs: {type: number}, lastError: {type: string}, lastErrorAt: {type: string, format: date-time}, running: {type: boolean}}}}
                  fetches: {type: object, additionalProperties: {type: integer}, description: 进程启动以来的拉取次数（source_ok、source_failed、rule_ok、rule_failed）}
                  since: {type: string, format: date-time}
  /api/v1/admin/retention:
    get:
      tags: [admin]
      summary: 生效的数据保留期（需求 R43）：网页设置优先，否则沿用环境变量；0 表示永不清理
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {auditDays: {type: integer}, requestDays: {type: integer}, auditFromSetting: {type: boolean}, requestFromSetting: {type: boolean}, auditDefault: {type: integer}, requestDefault: {type: integer}}}}}}}
    put:
      tags: [admin]
      summary: 设置保留期（天，0–3650）；某项为 null 时恢复为环境变量的值；立即生效，记入审计 admin.retention
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {auditDays: {type: integer, nullable: true}, requestDays: {type: integer, nullable: true}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {auditDays: {type: integer}, requestDays: {type: integer}, auditFromSetting: {type: boolean}, requestFromSetting: {type: boolean}, auditDefault: {type: integer}, requestDefault: {type: integer}}}}}}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/admin/usage:
    get:
      tags: [admin]
      summary: 各表的数据量与占用（需求 R43）；PostgreSQL 为统计信息中的估算行数与占用，SQLite 为精确行数与整库大小
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {dialect: {type: string}, total: {type: integer}, tables: {type: array, items: {type: object, properties: {table: {type: string}, rows: {type: integer}, bytes: {type: integer, description: -1 表示无法按表统计}, estimated: {type: boolean}}}}}}}}}}
  /api/v1/admin/users/{id}:
    delete:
      tags: [admin]
      summary: 立即注销账号（需求 R20，没有冷静期）；最后一个可用的管理员 409 account.last_admin；记入审计 admin.user.delete
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
    patch:
      tags: [admin]
      summary: 停用或启用账号；停用时注销其全部会话。不能停用自己
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [disabled], properties: {disabled: {type: boolean}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/admin/users/{id}/password:
    post:
      tags: [admin]
      summary: 重置密码并注销其全部会话
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/admin/users/{id}/quota:
    put:
      tags: [admin]
      summary: 设置配额（-1 表示使用默认值）
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Limits'}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '400': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/admin/audit:
    get:
      tags: [admin]
      summary: 全部审计记录（附账号名）
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/cursor'}, {$ref: '#/components/parameters/limit'}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}, next: {type: string}}}}}}}
  /api/v1/admin/status:
    get:
      tags: [admin]
      summary: 系统状态：版本、内核、目录、主密钥、可选功能
      security: [{session: []}]
      responses: {'200': {description: ok}}
  /api/v1/admin/stats:
    get:
      tags: [admin]
      summary: 全站统计：访问、登录、订阅请求的总数与近 90 天趋势，热门页面、客户端与设置项，令牌无效的请求来源
      security: [{session: []}]
      responses: {'200': {description: ok}, '404': {description: 不是管理员}}
  /api/v1/admin/registration:
    get:
      tags: [admin]
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Registration'}}}}, '404': {description: 不是管理员}}
    put:
      tags: [admin]
      summary: 打开或关闭无邀请注册
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Registration'}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Registration'}}}}}
  /api/v1/admin/node-mode:
    put:
      tags: [admin]
      summary: 设定全局默认的节点写法（inline 写入配置 / provider 交给客户端）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [default], properties: {default: {type: string, enum: [inline, provider]}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/NodeMode'}}}}, '400': {$ref: '#/components/responses/Problem'}}
  /api/v1/admin/pulse:
    get:
      tags: [admin]
      summary: 在线指示灯设置：是否向普通用户显示在线人数（默认否；管理员总能看到）
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/PulseSettings'}}}}}
    put:
      tags: [admin]
      summary: 设定是否向普通用户显示在线人数（记入审计 admin.pulse_online）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PulseSettings'}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/PulseSettings'}}}}, '400': {$ref: '#/components/responses/Problem'}}
  /api/v1/admin/mfa-policy:
    get:
      tags: [admin]
      summary: 两步验证策略：off 不要求，admins 要求管理员，all 要求全部用户
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/MFAPolicy'}}}}}
    put:
      tags: [admin]
      summary: 设定两步验证策略（记入审计 admin.mfa_policy）
      description: 要求别人之前管理员自己必须已启用（否则 409 mfa.policy_self）。策略适用而尚未启用的用户，除读取身份、同意协议、退出登录与启用 TOTP 外的已登录接口返回 403 mfa.setup_required；策略适用时不能关闭两步验证（409 mfa.required_by_policy）。
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MFAPolicy'}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/MFAPolicy'}}}}, '400': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/admin/terms:
    get:
      tags: [admin]
      summary: 当前协议的原始文本（占位符未替换）与随程序提供的默认文本（defaults），供编辑
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Terms'}, {type: object, properties: {defaults: {type: object, additionalProperties: {type: string}}}}]}}}}}
    put:
      tags: [admin]
      summary: 改写用户协议，或 reset 恢复随程序提供的默认文本；两者都生成新版本，普通用户需重新同意（记入审计 admin.terms）
      description: 文本可以使用占位符 {{audit_days}} 与 {{request_days}}，读取时替换为本站的保留期。每种语言最多 64 KiB，两种语言都必须提供。
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {texts: {type: object, properties: {zh-CN: {type: string}, en: {type: string}}}, reset: {type: boolean}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Terms'}}}}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/admin/invites:
    get:
      tags: [admin]
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/cursor'}, {$ref: '#/components/parameters/limit'}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/List'}}}}}
    post:
      tags: [admin]
      summary: 生成一次性邀请链接
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {hours: {type: integer, minimum: 0, maximum: 2160, description: 有效期（小时），0 表示不过期}, note: {type: string}}}}}}
      responses: {'201': {description: 已创建（url 只返回这一次）, content: {application/json: {schema: {$ref: '#/components/schemas/Invite'}}}}}
  /api/v1/admin/invites/{id}:
    delete:
      tags: [admin]
      summary: 撤销邀请
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/admin/invite-policy:
    get:
      tags: [admin]
      summary: 邀请规则：普通用户最近 30 天可发出的邀请数与注册满几天后才能邀请（需求 R12）
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/InvitePolicy'}}}}}
    put:
      tags: [admin]
      summary: 修改邀请规则
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InvitePolicy'}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/InvitePolicy'}}}}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/admin/users/{id}/invite-ban:
    put:
      tags: [admin]
      summary: 收回或恢复某人的邀请权；收回时其未用完的邀请随之作废
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [banned], properties: {banned: {type: boolean}}}}}}
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/invites:
    get:
      tags: [account]
      summary: 我的邀请名额、发出的邀请与邀请来的人（需求 R12）
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [quota, items, invitees], properties: {quota: {$ref: '#/components/schemas/InviteQuota'}, items: {type: array, items: {$ref: '#/components/schemas/Invite'}}, invitees: {type: array, items: {$ref: '#/components/schemas/Invitee'}}}}}}}}
    post:
      tags: [account]
      summary: 发出邀请。hours 为有效期（0 不过期，最长 2160），maxUses 为可用次数（默认 1，最多 100）。管理员不受名额限制；只有管理员的邀请赋予「受邀用户」权限
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {hours: {type: integer}, note: {type: string, maxLength: 200}, maxUses: {type: integer}}}}}}
      responses: {'201': {description: created, content: {application/json: {schema: {$ref: '#/components/schemas/Invite'}}}}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/invites/{id}/revoke:
    post:
      tags: [account]
      summary: 作废自己发出的邀请
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/register/inviter:
    post:
      tags: [session]
      summary: 凭邀请令牌查询邀请人（注册页显示「由谁邀请」）；令牌在请求体中，不进访问日志；无效时 404
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [token], properties: {token: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [username], properties: {username: {type: string}, nickname: {type: string}}}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/username:
    put:
      tags: [account]
      summary: 改用户名（需要当前密码）。180 天一次；旧名保留 180 天，期间别人不能使用（需求 R4）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username, password], properties: {username: {type: string}, password: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/account/nickname:
    put:
      tags: [account]
      summary: 设置昵称（空串清除）；可含空格，最多 32 个字符（需求 R5）
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [nickname], properties: {nickname: {type: string}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/catalog/{pack}:
    get:
      tags: [catalog]
      summary: 字段目录元数据、客户端预设、规则源预设与装饰 emoji
      parameters: [{$ref: '#/components/parameters/pack'}]
      responses: {'200': {description: ok}, '304': {description: 未修改}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/catalog/{pack}/schema:
    get:
      tags: [catalog]
      summary: JSON Schema（draft 2020-12）
      parameters: [{$ref: '#/components/parameters/pack'}, {$ref: '#/components/parameters/lang'}]
      responses: {'200': {description: ok}}
  /api/v1/catalog/{pack}/messages:
    get:
      tags: [catalog]
      summary: 字段说明的 i18n 消息
      parameters: [{$ref: '#/components/parameters/pack'}, {$ref: '#/components/parameters/lang'}]
      responses: {'200': {description: ok}}
  /api/v1/diagnostics:
    get:
      tags: [catalog]
      summary: 全部诊断代码与中英文消息
      responses: {'200': {description: ok}}
  /api/v1/sources:
    get:
      tags: [sources]
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/cursor'}, {$ref: '#/components/parameters/limit'}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/List'}}}}}
    post:
      tags: [sources]
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SourceInput'}}}}
      responses: {'201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}, '400': {$ref: '#/components/responses/Problem'}}
  /api/v1/sources/{id}:
    get:
      tags: [sources]
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}, '404': {$ref: '#/components/responses/Problem'}}
    put:
      tags: [sources]
      description: 保存后重新生成用到它的配置（含被授权方），订阅链接随之更新；订阅地址变了时丢弃旧地址的快照并立即拉取（手动拉取次数用完时等定时任务）。
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/ifMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SourceInput'}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}, '404': {$ref: '#/components/responses/Problem'}, '412': {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [sources]
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/sources/{id}/refresh:
    post:
      tags: [sources]
      summary: 立即拉取订阅
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'200': {description: 快照状态, content: {application/json: {schema: {$ref: '#/components/schemas/Snapshot'}}}}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/sources/{id}/nodes:
    get:
      tags: [sources]
      summary: 解析结果、整理后的节点与跳过清单
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {format: {type: string}, nodes: {type: array, items: {$ref: '#/components/schemas/Node'}}, diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}}}}}}}
  /api/v1/events:
    get:
      tags: [events]
      summary: 实时通道（WebSocket）
      description: |
        升级为 WebSocket 后，服务器推送当前用户的数据变化事件 {type, id}：render、source、rules、message、sub、grant；
        联系人的 typing（id 为对方用户名）与 presence（state 为 on 或 off，只在互为联系人时推送，断开 15 秒后才算下线）。
        notice 表示有新的站内提醒（id 为提醒 ID）。
        连接建立时先发 hello（version 为服务器版本；服务端内核检查不可用时 kernel 为 unavailable），丢过事件时发 resync。事件不含数据本身，收到后经对应接口重读。
        浏览器可发 {"type":"typing","to":"<用户名>"}（每 2 秒最多一次）与 {"type":"ping","id":"<不超过 32 字节>"}（每秒最多一次，回 pong 并带回 id）。
        hello 与 pong 的 online 是在线人数：总是发给管理员，是否发给普通用户见 /api/v1/admin/pulse。
        握手需要会话 Cookie 与同源的 Origin；每个用户最多 16 条连接；会话失效后服务器关闭连接（1008）。
      security: [{session: []}]
      responses: {'101': {description: 已升级为 WebSocket}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /api/v1/pulse:
    get:
      tags: [events]
      summary: 在线指示灯的数据；实时通道连不上时浏览器每 15 秒轮询（标签页隐藏时暂停）
      description: version 为服务器版本；online 为在线人数（按实时通道的连接去重，只发给有权看的人）；unread 为未读消息数；kernel 为服务端内核检查是否可用。
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, required: [version, unread, kernel], properties: {version: {type: string}, online: {type: integer}, unread: {type: integer}, kernel: {type: boolean}}}}}}, '401': {$ref: '#/components/responses/Problem'}}
  /api/v1/sources/{id}/nodes/preview:
    post:
      tags: [sources]
      summary: 按编辑中、尚未保存的内容与整理设置解析节点，不写存储
      description: 与 GET …/nodes 使用同一解析与整理；content 只对手动节点生效，订阅始终使用拉取快照。
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {content: {type: string}, processing: {type: object}}}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {format: {type: string}, nodes: {type: array, items: {$ref: '#/components/schemas/Node'}}, diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}}}}}}, '400': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/rule-sources:
    get:
      tags: [rule-sources]
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/cursor'}, {$ref: '#/components/parameters/limit'}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/List'}}}}}
    post:
      tags: [rule-sources]
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RuleSourceInput'}}}}
      responses: {'201': {description: 已创建, content: {application/json: {schema: {$ref: '#/components/schemas/RuleSource'}}}}, '400': {$ref: '#/components/responses/Problem'}}
  /api/v1/rule-sources/preview:
    post:
      tags: [rules]
      summary: 校验编辑中的规则源并预览策略组（O2），不写存储
      description: |
        用请求中的文本（未保存）与一份配置的节点源（profile；为空时用本人全部节点源）走一遍生成流程，返回每个策略组最终包含的组与节点、规则条数与诊断。
        诊断带 file（groups | rulesets | ini）与 line（从 1 开始），编辑器据此在行内标出。source 指定正在编辑的规则源时，文本为空的部分用它已保存的内容或拉取快照补上。受预览限流约束
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {kind: {type: string, enum: [toml, ini]}, groupsText: {type: string}, rulesetsText: {type: string}, iniText: {type: string}, profile: {type: string}, source: {type: string}}}}}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [groups, rules, nodes, diagnostics]
                properties:
                  groups: {type: array, items: {type: object, required: [name, type, members], properties: {name: {type: string}, type: {type: string}, members: {type: array, items: {type: string}}, use: {type: array, items: {type: string}}, filter: {type: string}}}}
                  rules: {type: integer}
                  nodes: {type: integer}
                  diagnostics: {type: array, items: {allOf: [{$ref: '#/components/schemas/Diagnostic'}, {type: object, properties: {file: {type: string, enum: [groups, rulesets, ini]}, line: {type: integer}}}]}}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/rule-sources/{id}:
    get:
      tags: [rule-sources]
      security: [{session: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/RuleSource'}}}}, '404': {$ref: '#/components/responses/Problem'}}
    put:
      tags: [rule-sources]
      description: 保存后重新生成引用它的配置，订阅链接随之更新；地址变了的部分丢弃旧快照并立即拉取。
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/ifMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RuleSourceInput'}}}}
      responses: {'200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/RuleSource'}}}}, '412': {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [rule-sources]
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'204': {$ref: '#/components/responses/NoContent'}}
  /api/v1/rule-sources/{id}/refresh:
    post:
      tags: [rule-sources]
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses: {'200': {description: ok}}
  /api/v1/rule-hosts:
    get:
      tags: [rule-sources]
      summary: 当前用户的分流规则地址可以使用的站点；restricted=false 表示不限制（管理员）
      security: [{session: []}]
      responses: {'200': {description: ok, content: {application/json: {schema: {type: object, properties: {restricted: {type: boolean}, hosts: {type: array, items: {type: string}}}}}}}}
  /u/{code}:
    get:
      tags: [subscription]
      summary: 短链接（反馈 #74）：直接返回所指配置链接的内容，与 /s/ 相同；请求同时计入原链接与短链接
      description: 不重定向，不暴露原链接。不存在、已停用或已过期时返回 404；同一 IP 一小时内猜错 30 次后返回 429。支持 ?download=1。
      parameters: [{name: code, in: path, required: true, schema: {type: string}}, {name: download, in: query, schema: {type: string}}]
      responses:
        '200': {description: text/yaml, content: {text/yaml: {schema: {type: string}}}}
        '404': {description: 短码无效}
        '429': {description: 猜错次数过多或超出频率限制}
  /api/v1/short-links:
    get:
      tags: [short-links]
      summary: 自己的短链接，含所指链接、累计请求数与近 30 天趋势
      security: [{session: []}]
      responses: {'200': {description: ok}}
    post:
      tags: [short-links]
      summary: 新建短链接；只能指向自己的配置链接；code 留空时随机生成 8 位
      security: [{session: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [linkId], properties: {linkId: {type: string}, code: {type: string}, note: {type: string}, expiresAt: {type: string, format: date-time}}}}}}
