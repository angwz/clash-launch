# Clash, Launch! 单容器部署。对外只暴露本机的 8080，由 nginx/Caddy 反向代理并提供 HTTPS。
# 首次启动后打开对外地址注册首个管理员（第一个访问者成为管理员，之后不再开放）。
# 服务器直接拉取订阅：订阅提供方能看到本机的出口 IP（docs/decisions/0003）。
services:
  clash-launch:
    image: ghcr.io/angwz/clash-launch:latest
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - data:/data
    environment:
      CLASH_LAUNCH_PUBLIC_URL: https://cl.example.com   # 改为你的对外地址
      CLASH_LAUNCH_TRUSTED_PROXIES: 172.16.0.0/12        # 反向代理所在网段；直连部署时删除
    ports:
      - "127.0.0.1:8080:8080"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/clash-launch", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
