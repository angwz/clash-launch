# Clash, Launch! —— docker compose 部署（说明见 README「部署」与 docs/guide/deploy.md）。
#
#   启动：docker compose up -d        打开 http://<服务器 IP>:20230 注册管理员（第一个访问者成为管理员）
#   更新：docker compose pull && docker compose up -d
#
# 默认用明文 HTTP 并对所有 IP 开放 20230 端口，方便试用。正式使用前请加 HTTPS 反向代理，
# 否则登录口令与订阅链接里的令牌会以明文经过网络（风险与做法见 README「安全」）。
services:
  clash-launch:
    image: ghcr.io/angwz/clash-launch:latest   # 换镜像仓库或固定版本时只改这一行，如 :1.0.0
    container_name: clash-launch
    restart: unless-stopped
    ports:
      - "20230:20230"                           # 对外开放，浏览器直接访问；同一台机器上配了 HTTPS 反代后可改为 "127.0.0.1:20230:20230"
    # 以 root 启动：程序先把 /data 交给运行用户 65532，再立刻放弃 root（之后与普通用户运行无异）。
    # 这样数据放在 Docker 数据卷或宿主机目录都能直接用，不需要手动改权限。
    user: "0:0"
    volumes:
      # 数据库与主密钥（master.key）：备份时两者都要。二选一：
      - data:/data                              # Docker 数据卷（默认）
      # - ./data:/data                          # 当前目录下的 data 文件夹（同时删掉文件末尾的 volumes 段）
    environment:
      # 对外地址：生成的订阅链接以它为准；不填时根据请求推断。加了 HTTPS 后改为 https://你的域名
      # CLASH_LAUNCH_PUBLIC_URL: http://203.0.113.10:20230
      # 放在反向代理之后时填代理所在网段，服务才会采信 X-Forwarded-For 中的真实 IP
      # CLASH_LAUNCH_TRUSTED_PROXIES: 172.16.0.0/12
      CLASH_LAUNCH_LOG_LEVEL: info
    # 安全加固：只读根文件系统、去掉其余全部 Linux 能力、禁止提权；数据只写 /data 与 /tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]   # 只用于启动时整理 /data 并降权；降权后全部失效
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/clash-launch", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
